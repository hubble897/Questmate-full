name: Build QuestMate v83 with native F2P button

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout existing v83 APK
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify original v83 APK
        shell: bash
        run: |
          set -euo pipefail
          test -f INSTALL-THIS-QM-v83-VERIFIED-DATA.apk || { echo 'Upload your original APK to the repository root'; exit 1; }
          echo 'f540301a5a83281104aa07d9b9cf2f90de5a0d3adc67c52e33b90e28df23b702  INSTALL-THIS-QM-v83-VERIFIED-DATA.apk' | sha256sum -c -

      - name: Download verified Apktool
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 -o apktool.jar https://github.com/iBotPeaches/Apktool/releases/download/v3.0.3/apktool_3.0.3.jar
          echo 'dbf930b076c6b9be08d57c449cacefc3bdd6b71ebd59b3066fc0e1f5b14f9423  apktool.jar' | sha256sum -c -
          java -jar apktool.jar --version

      - name: Decode original APK
        shell: bash
        run: |
          set -euo pipefail
          java -jar apktool.jar d -f INSTALL-THIS-QM-v83-VERIFIED-DATA.apk -o decoded

      - name: Add native multi-quest data and check every quest name
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYDATA'
          import base64,zlib,json,zipfile,pathlib
          blob=''
          stages=json.loads(zlib.decompress(base64.b64decode(blob)))
          q={x['name'] for x in json.loads(zipfile.ZipFile('INSTALL-THIS-QM-v83-VERIFIED-DATA.apk').read('assets/quests.json'))}
          mentioned={quest for stage in stages for task in stage['steps'] for quest in task['quests']}
          assert mentioned<=q, f'Unknown quests: {mentioned-q}'
          assert len(stages)==10 and sum(len(x['steps']) for x in stages)==47 and len(mentioned)==24
          path=pathlib.Path('decoded/assets/f2p_multiroute.json')
          path.parent.mkdir(exist_ok=True)
          path.write_text(json.dumps(stages,ensure_ascii=False,separators=(',',':')),encoding='utf-8')
          print('47 checklist tasks, 10 stages, and 24 valid F2P quest names')
          PYDATA

      - name: Add F2P button and real native Android screen
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYPATCH'
          from pathlib import Path
          import re,xml.etree.ElementTree as ET
          root=Path('decoded')
          main_files=list(root.glob('smali*/com/questmate/v83fullcrosscheck/MainActivity.smali'))
          assert len(main_files)==1, f'Expected original main class, got {main_files}'
          main=main_files[0]
          s=main.read_text()
          MAIN='Lcom/questmate/v83fullcrosscheck/MainActivity;'
          # Append new native-screen button after construction of original home layout.
          show=re.search(r'(?ms)^\.method\s+[^\n]*\s+showList\(\)V\s*$.*?^\.end method\s*$',s)
          assert show,'Original QuestMate home method showList() not found'
          method=show.group(0)
          needle=re.compile(r'(\s+invoke-direct(?:/range)?\s+\{[^}]+\},\s+'+re.escape(MAIN)+r'->page\(\)Landroid/widget/LinearLayout;\s*\n\s*move-result-object\s+(v\d+))')
          m=needle.search(method)
          assert m,'Could not locate root LinearLayout on v83 main screen'
          reg=m.group(2)
          # Smali correctness: create button only on the home page.
          method=method[:m.end()]+'\n    invoke-static {'+reg+'}, '+MAIN+'->addF2PButton(Landroid/widget/LinearLayout;)V'+method[m.end():]
          s=s[:show.start()]+method+s[show.end():]
          # The quest chips return to the original in-app quest detail implementation.
          on=re.search(r'(?ms)^\.method[^\n]*\s+onCreate\(Landroid/os/Bundle;\)V\s*$.*?^\.end method',s)
          assert on,'Original onCreate missing'
          onm=on.group(0)
          pos=onm.rfind('return-void')
          assert pos>=0
          onm=onm[:pos]+'invoke-direct {p0}, '+MAIN+'->maybeOpenF2PQuest()V\n    '+onm[pos:]
          s=s[:on.start()]+onm+s[on.end():]
          s+='\n.method private static addF2PButton(Landroid/widget/LinearLayout;)V\n    .locals 3\n    invoke-virtual {p0}, Landroid/widget/LinearLayout;->getContext()Landroid/content/Context;\n    move-result-object v1\n    new-instance v0, Landroid/widget/Button;\n    invoke-direct {v0, v1}, Landroid/widget/Button;-><init>(Landroid/content/Context;)V\n    const-string v2, "F2P Quest Efficiency (Multi-Quest)"\n    invoke-virtual {v0, v2}, Landroid/widget/Button;->setText(Ljava/lang/CharSequence;)V\n    const v2, -0xc3a775\n    invoke-virtual {v0, v2}, Landroid/widget/Button;->setBackgroundColor(I)V\n    const/4 v2, -0x1\n    invoke-virtual {v0, v2}, Landroid/widget/Button;->setTextColor(I)V\n    check-cast v1, Lcom/questmate/v83fullcrosscheck/MainActivity;\n    new-instance v2, Lcom/questmate/v83fullcrosscheck/F2PButtonClick;\n    invoke-direct {v2, v1}, Lcom/questmate/v83fullcrosscheck/F2PButtonClick;-><init>(Lcom/questmate/v83fullcrosscheck/MainActivity;)V\n    invoke-virtual {v0, v2}, Landroid/widget/Button;->setOnClickListener(Landroid/view/View$OnClickListener;)V\n    invoke-virtual {p0, v0}, Landroid/widget/LinearLayout;->addView(Landroid/view/View;)V\n    return-void\n.end method\n.method private maybeOpenF2PQuest()V\n    .locals 2\n    invoke-virtual {p0}, Landroid/app/Activity;->getIntent()Landroid/content/Intent;\n    move-result-object v0\n    if-eqz v0, :done\n    const-string v1, "qm_f2p_quest"\n    invoke-virtual {v0, v1}, Landroid/content/Intent;->getStringExtra(Ljava/lang/String;)Ljava/lang/String;\n    move-result-object v0\n    if-eqz v0, :done\n    invoke-direct {p0, v0}, Lcom/questmate/v83fullcrosscheck/MainActivity;->findQuest(Ljava/lang/String;)Lcom/questmate/v83fullcrosscheck/MainActivity$Quest;\n    move-result-object v0\n    if-eqz v0, :done\n    invoke-direct {p0, v0}, Lcom/questmate/v83fullcrosscheck/MainActivity;->showQuest(Lcom/questmate/v83fullcrosscheck/MainActivity$Quest;)V\n    :done\n    return-void\n.end method\n'
          main.write_text(s)
          package_path=main.parent
          (package_path/'F2PButtonClick.smali').write_text('.class public final Lcom/questmate/v83fullcrosscheck/F2PButtonClick;\n.super Ljava/lang/Object;\n.implements Landroid/view/View$OnClickListener;\n.field private final owner:Lcom/questmate/v83fullcrosscheck/MainActivity;\n.method public constructor <init>(Lcom/questmate/v83fullcrosscheck/MainActivity;)V\n    .locals 0\n    invoke-direct {p0}, Ljava/lang/Object;-><init>()V\n    iput-object p1, p0, Lcom/questmate/v83fullcrosscheck/F2PButtonClick;->owner:Lcom/questmate/v83fullcrosscheck/MainActivity;\n    return-void\n.end method\n.method public onClick(Landroid/view/View;)V\n    .locals 3\n    iget-object v0, p0, Lcom/questmate/v83fullcrosscheck/F2PButtonClick;->owner:Lcom/questmate/v83fullcrosscheck/MainActivity;\n    new-instance v1, Landroid/content/Intent;\n    const-class v2, Lcom/questmate/v83fullcrosscheck/F2PNativeActivity;\n    invoke-direct {v1, v0, v2}, Landroid/content/Intent;-><init>(Landroid/content/Context;Ljava/lang/Class;)V\n    invoke-virtual {v0, v1}, Landroid/app/Activity;->startActivity(Landroid/content/Intent;)V\n    return-void\n.end method\n')
          (package_path/'F2PNativeActivity.smali').write_text('.class public Lcom/questmate/v83fullcrosscheck/F2PNativeActivity;\n.super Landroid/app/Activity;\n.field private prefs:Landroid/content/SharedPreferences;\n.field private stack:Landroid/widget/LinearLayout;\n.field private taskCounter:I\n.method public constructor <init>()V\n    .locals 0\n    invoke-direct {p0}, Landroid/app/Activity;-><init>()V\n    return-void\n.end method\n.method protected onCreate(Landroid/os/Bundle;)V\n    .locals 6\n    invoke-super {p0, p1}, Landroid/app/Activity;->onCreate(Landroid/os/Bundle;)V\n    const-string v0, "F2P Multi-Quest Guide"\n    invoke-virtual {p0, v0}, Landroid/app/Activity;->setTitle(Ljava/lang/CharSequence;)V\n    const-string v0, "qm_f2p_checklist_native_v1"\n    const/4 v1, 0x0\n    invoke-virtual {p0, v0, v1}, Landroid/content/Context;->getSharedPreferences(Ljava/lang/String;I)Landroid/content/SharedPreferences;\n    move-result-object v0\n    iput-object v0, p0, Lcom/questmate/v83fullcrosscheck/F2PNativeActivity;->prefs:Landroid/content/SharedPreferences;\n    new-instance v0, Landroid/widget/ScrollView;\n    invoke-direct {v0, p0}, Landroid/widget/ScrollView;-><init>(Landroid/content/Context;)V\n    new-instance v1, Landroid/widget/LinearLayout;\n    invoke-direct {v1, p0}, Landroid/widget/LinearLayout;-><init>(Landroid/content/Context;)V\n    const/4 v2, 0x1\n    invoke-virtual {v1, v2}, Landroid/widget/LinearLayout;->setOrientation(I)V\n    const v2, -0xf4ead9\n    invoke-virtual {v1, v2}, Landroid/view/View;->setBackgroundColor(I)V\n    const/16 v2, 0xc\n    invoke-virtual {v1, v2, v2, v2, v2}, Landroid/view/View;->setPadding(IIII)V\n    invoke-virtual {v0, v1}, Landroid/widget/ScrollView;->addView(Landroid/view/View;)V\n    iput-object v1, p0, Lcom/questmate/v83fullcrosscheck/F2PNativeActivity;->stack:Landroid/widget/LinearLayout;\n    invoke-virtual {p0, v0}, Landroid/app/Activity;->setContentView(Landroid/view/View;)V\n    const-string v2, "F2P QUE