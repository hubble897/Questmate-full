          manifest=root/'AndroidManifest.xml'
          ns='http://schemas.android.com/apk/res/android'
          ET.register_namespace('android',ns)
          tree=ET.parse(manifest)
          mr=tree.getroot()
          oldpkg=mr.get('package')
          assert oldpkg
          for tag in mr.iter():
              if tag.tag in ('activity','activity-alias','service','receiver','provider'):
                  key='{'+ns+'}name'
                  name=tag.get(key)
                  if name and name.startswith('.'):
                      tag.set(key,oldpkg+name)
          app=mr.find('application')
          assert app is not None
          act=ET.SubElement(app,'activity')
          act.set('{'+ns+'}name','com.questmate.v83fullcrosscheck.F2PNativeActivity')
          act.set('{'+ns+'}exported','false')
          act.set('{'+ns+'}label','F2P Quest Efficiency')
          mr.set('package','com.questmate.v83f2pnative')
          tree.write(manifest,encoding='utf-8',xml_declaration=True)
          print('Installed native multiquest activity and main-screen button. Kept original code and assets.')

          PYPATCH

      - name: Recompile original app plus native screen
        shell: bash
        run: |
          set -euo pipefail
          java -jar apktool.jar b decoded -o unsigned.apk
          test -s unsigned.apk

      - name: Sign installable Android APK
        shell: bash
        run: |
          set -euo pipefail
          BT="$ANDROID_HOME/build-tools/35.0.0"
          if [ ! -x "$BT/apksigner" ]; then sdkmanager 'build-tools;35.0.0'; fi
          BT="$ANDROID_HOME/build-tools/35.0.0"
          keytool -genkeypair -alias qm-native -keyalg RSA -keysize 3072 -validity 7300 -keystore dev-sign.jks -storepass android -keypass android -dname 'CN=QuestMate F2P Native Test, O=QuestMate, C=AU' -noprompt
          "$BT/zipalign" -f -p 4 unsigned.apk aligned.apk
          "$BT/apksigner" sign --ks dev-sign.jks --ks-key-alias qm-native --ks-pass pass:android --key-pass pass:android --out QuestMate-v84-F2P-NATIVE.apk aligned.apk
          "$BT/apksigner" verify --verbose QuestMate-v84-F2P-NATIVE.apk

      - name: Verify unchanged original data and new real screen
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import zipfile,json
          a=zipfile.ZipFile('INSTALL-THIS-QM-v83-VERIFIED-DATA.apk')
          b=zipfile.ZipFile('QuestMate-v84-F2P-NATIVE.apk')
          for path in ('assets/quests.json','assets/cape_route.json','assets/clues.json','assets/ge_items.json'):
              assert a.read(path)==b.read(path), 'Original content changed: '+path
              print('Preserved exactly:',path)
          assert 'assets/f2p_multiroute.json' in b.namelist()
          assert not any(x.endswith('f2p_route.html') for x in b.namelist())
          dex=b''.join(b.read(x) for x in b.namelist() if x.endswith('.dex'))
          for cls in (b'F2PNativeActivity',b'F2PButtonClick',b'F2PCheckClick',b'F2PQuestClick'):
              assert cls in dex, 'Missing native Android component: '+str(cls)
          assert b'F2P Quest Efficiency' in dex, 'Home button label missing'
          print('Built an Android native scrolling checklist and in-app quest buttons, with original data unchanged.')
          PY

      - name: Upload updated QuestMate APK
        uses: actions/upload-artifact@v4
        with:
          name: QuestMate-v84-F2P-NATIVE
          path: QuestMate-v84-F2P-NATIVE.apk
          if-no-files-found: error
          retention-days: 30
