              private void loadCapeRoute() {
                  try {
                      BufferedReader br=new BufferedReader(new InputStreamReader(getAssets().open("cape_route.json")));
                      StringBuilder sb=new StringBuilder(); String line; while((line=br.readLine())!=null) sb.append(line); br.close();
                      JSONArray a=new JSONArray(sb.toString());
                      for(int i=0;i<a.length();i++) {
                          JSONObject o=a.getJSONObject(i); RouteStep rs=new RouteStep();
                          rs.type=o.optString("type","training"); rs.title=o.optString("title","Route step"); rs.detail=o.optString("detail",""); rs.questName=o.optString("questName","");
                          capeRoute.add(rs);
                      }
                  } catch(Exception e) {
