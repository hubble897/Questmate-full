          def patch_desert_treasure_ii(q, full_steps, quick_steps, runelite_steps):
              """For DT2, never keep synthetic instructions such as 'do step'.
              Prefer the longest detailed Wiki walkthrough, because the quest contains
              several large self-contained routes and boss sections that must remain expanded.
              """
              candidates=[
                  ('OSRS Wiki full guide', strip_generic_steps(full_steps)),
                  ('OSRS Wiki quick guide', strip_generic_steps(quick_steps)),
                  ('RuneLite Quest Helper', strip_generic_steps(runelite_steps)),
                  ('current selection', strip_generic_steps(q.get('steps',[]))),
              ]
              source,best=max(candidates,key=lambda pair:detail_score(pair[1]))
              # DT2 should be a long guide. Prefer the full guide whenever it contains
              # a substantial ordered walkthrough even if another source scores similarly.
              full_clean=strip_generic_steps(full_steps)
              if len(full_clean)>=35:
                  source,best='OSRS Wiki full guide',full_clean
              q['steps']=best
              q['sourceNote']=(
                  f'Desert Treasure II uses {source} with every extracted sub-section expanded in order. '
                  'Generic placeholder instructions are removed at build time.'
              )
              return q

          DEFENCE_REWARD_FALLBACK={
              "A Soul's Bane","In Search of the Myreque","In Aid of the Myreque",
              "Nature Spirit","What Lies Below","The Fremennik Trials","Heroes' Quest",
              "Between a Rock...","Olaf's Quest","Holy Grail","Dragon Slayer I",
              "King's Ransom","Monkey Madness I","The Fremennik Isles","Legends' Quest",
              "Dream Mentor"
          }

          PRAYER_REWARD_FALLBACK={
              "The Restless Ghost","Priest in Peril","Holy Grail","Recruitment Drive",
              "Mountain Daughter","Ghosts Ahoy","Spirits of the Elid","Making History",
              "Rag and Bone Man II","Rum Deal","The Great Brain Robbery","Swan Song",
              "Zogre Flesh Eaters","Tai Bwo Wannai Trio","King's Ransom"
          }

          def reward_blob(q):
              return ' '.join(str(x) for x in q.get('rewards',[])).lower()

          def norm_reward_name(name):
              return re.sub(r'[^a-z0-9]','',clean(name).lower())

          DEFENCE_REWARD_KEYS={norm_reward_name(x) for x in DEFENCE_REWARD_FALLBACK}
          PRAYER_REWARD_KEYS={norm_reward_name(x) for x in PRAYER_REWARD_FALLBACK}

          def reward_mentions_skill_xp(blob, skill_words):
              # Reward metadata can be worded as "Defence experience", "Defence XP",
              # "2,000 Defence", or "experience in Defence". Accept all of those while
              # still requiring reward-context evidence.
              b=' '+blob.lower()+' '
              if not any(w in b for w in skill_words):
                  return False
              return (
                  'experience' in b or ' xp' in b or
                  bool(re.search(r'\b\d[\d,\.]*\s*(?:defence|defense|prayer)\b', b)) or
                  bool(re.search(r'\b(?:defence|defense|prayer)\s*[:\-]?\s*\d[\d,\.]*\b', b))
              )

          def has_defence_reward(q):
              blob=reward_blob(q)
              direct=reward_mentions_skill_xp(blob,('defence','defense'))
              return direct or norm_reward_name(q.get('name','')) in DEFENCE_REWARD_KEYS

          def has_prayer_reward(q):
              blob=reward_blob(q)
              direct=reward_mentions_skill_xp(blob,('prayer',))
              return direct or norm_reward_name(q.get('name','')) in PRAYER_REWARD_KEYS

          def has_real_reward(q):
              rewards=[clean(x) for x in q.get('rewards',[]) if clean(x)]
              if not rewards: return False
              blob=' '.join(rewards).lower()
              bad=('could not be verified','unavailable','unknown reward','reward data')
              return not any(x in blob for x in bad)

          def has_quest_point_reward(q):
              # Main OSRS quests award Quest Point(s); miniquests and scraper noise do not.
              blob=reward_blob(q)
              return bool(re.search(r'\bquest\s+points?\b|\bqp\b', blob, re.I))

          def parse_start_info(markup):
              soup=safe_soup(markup)
              if soup is None: return ''
              for tr in soup.find_all('tr'):
                  cells=tr.find_all(['th','td'],recursive=False)
                  if len(cells)>=2:
                      h=clean(cells[0].get_text(' ',strip=True)).lower()
                      if h.startswith('start point') or h.startswith('start location'):
                          return clean(cells[1].get_text(' ',strip=True))
              return ''

          def qh_requirements(title, canonical_titles):
              """Extract hard skill and quest prerequisites from RuneLite Quest Helper.
              Wiki stays the primary display source; RuneLite fills missing structured fields
              and provides an independent disagreement report."""
              skills={}; tokens=[]
              for p in qh_candidates(title):
                  try: text=p.read_text(encoding='utf-8',errors='ignore')
                  except Exception: continue
                  for sk,lvl in re.findall(r'new\s+SkillRequirement\s*\(\s*Skill\.([A-Z_]+)\s*,\s*([0-9_]+)',text,re.I):
                      name=sk.replace('_',' ').title()
                      if name=='Runecrafting': name='Runecraft'
                      skills[name]=max(skills.get(name,0),int(lvl.replace('_','')))
                  tokens += re.findall(r'QuestDetails\.([A-Z0-9_]+)',text)
                  if skills or tokens: break
              cmap={title_key(x):x for x in canonical_titles}
              prereq=[]
              for tok in tokens:
                  k=title_key(tok.replace('_',' '))
                  if k in cmap: prereq.append(cmap[k]); continue
                  # Conservative fuzzy enum-token match.
                  for ck,ct in cmap.items():
                      if len(k)>=8 and (ck.startswith(k) or k.startswith(ck)):
                          prereq.append(ct); break
              return skills,dedupe(prereq)

          def parse_membership(markup):
              """Use the live Wiki infobox for F2P/P2P classification."""
              soup=safe_soup(markup)
              if soup is None: return ''
              for tr in soup.find_all('tr'):
                  cells=tr.find_all(['th','td'],recursive=False)
                  if len(cells)>=2:
                      h=clean(cells[0].get_text(' ',strip=True)).lower()
                      if h in ('members only','members'):
                          value=clean(cells[-1].get_text(' ',strip=True)).lower()
                          if re.search(r'\bno\b|free[- ]?to[- ]?play|f2p',value): return 'F2P'
                          if re.search(r'\byes\b|members|p2p',value): return 'P2P'
              return ''

          def parse_requirements(markup, canonical_titles):
              """Parse only the OSRS Wiki infobox Requirements row.
              Returns the exact visible notes plus hard skill levels and prerequisite quest names.
              Recommendations elsewhere on the page are never promoted to hard requirements.
              """
              soup=safe_soup(markup)
              if soup is None: return [],{},[]
              bodies=[]
              for tr in soup.find_all('tr'):
                  cells=tr.find_all(['th','td'],recursive=False)
                  if len(cells)>=2:
                      h=clean(cells[0].get_text(' ',strip=True)).lower()
                      if h in ('requirements','requirement'):
                          bodies.append(cells[-1])
              if not bodies: return [],{},[]
              vals=[]; links=[]
              for body in bodies:
                  lis=body.find_all('li')
                  if lis: vals += [clean(li.get_text(' ',strip=True)) for li in lis]
                  else:
                      t=clean(body.get_text(' ',strip=True))
                      if t: vals.append(t)
                  for a in body.find_all('a'):
                      label=clean(a.get('title','') or a.get_text(' ',strip=True))
                      if label: links.append(label)
              vals=dedupe([x for x in vals if x])
              joined=' • '.join(vals)
              # Explicit None means exactly no skill or prerequisite quest requirements.
              if re.fullmatch(r'(?i)(?:none|n/?a|no requirements?)\.?',joined.strip()):
                  return ['None'],{},[]
              skill_names=('Attack','Strength','Defence','Ranged','Prayer','Magic','Runecraft','Construction','Hitpoints','Agility','Herblore','Thieving','Crafting','Fletching','Slayer','Hunter','Mining','Smithing','Fishing','Cooking','Firemaking','Woodcutting','Farming','Sailing')
              r1=re.compile(r'\b(\d{1,2})\s+('+'|'.join(map(re.escape,skill_names))+r')\b',re.I)
              r2=re.compile(r'\b('+'|'.join(map(re.escape,skill_names))+r')\s+(?:level\s+)?(\d{1,2})\b',re.I)
              skill_req={}
              for lvl,sk in r1.findall(joined):
                  sk=next(x for x in skill_names if x.lower()==sk.lower()); skill_req[sk]=max(skill_req.get(sk,0),int(lvl))
              for sk,lvl in r2.findall(joined):
                  sk=next(x for x in skill_names if x.lower()==sk.lower()); skill_req[sk]=max(skill_req.get(sk,0),int(lvl))
              cmap={title_key(x):x for x in canonical_titles}
              prereq=[]
              for label in links:
                  k=title_key(label)
                  if k in cmap: prereq.append(cmap[k])
              low=joined.lower()
              # Plain-text prerequisite names are accepted only as whole quest names occurring
              # in the Requirements row; the current quest itself is removed later.
              for ct in canonical_titles:
                  if len(ct)>=4 and re.search(r'(?<![A-Za-z0-9])'+re.escape(ct.lower())+r'(?![A-Za-z0-9])',low):
                      prereq.append(ct)
              return vals,skill_req,dedupe(prereq)


          def authoritative_main_quest_titles():
              """Return the exact current OSRS main quest list from Quests/List.

              Quests/List is the correct source for *which entries are main quests*.
              Its numbered quest rows include the parent Recipe for Disaster as #100,
              while RFD subquests are decimal rows such as 100.1, 100.2, etc.
              Only whole-number IDs are accepted. Miniquests have no numeric quest ID
              in their table and are therefore excluded as well.
              """
              list_url='https://osrsindex.com/wiki/quests-list?site=osrs_wiki'
              summary_url='https://osrsindex.com/wiki/quests?site=osrs_wiki'
              try:
                  rr=session.get(list_url,timeout=(5,25))
                  rr.raise_for_status()
                  soup=BeautifulSoup(rr.text,'lxml')

                  titles=[]
                  ids=[]
                  skipped_decimal=[]
                  for tr in soup.find_all('tr'):
                      cells=tr.find_all(['th','td'],recursive=False)
                      if len(cells)<2:
                          continue

                      number=clean(cells[0].get_text(' ',strip=True))
                      # RFD subquests are explicitly decimal-numbered (100.1 ... 100.9).
                      if re.fullmatch(r'\d+\.\d+',number):
                          skipped_decimal.append(number)
                          continue
                      if not re.fullmatch(r'\d+',number):
                          continue

                      a=cells[1].find('a',href=True)
                      title=clean((a.get('title') if a else '') or
                                  (a.get_text(' ',strip=True) if a else cells[1].get_text(' ',strip=True)))
                      if not title:
                          continue
                      if '/' in title:
                          raise RuntimeError(f'numbered main-quest row unexpectedly contains subpage title: {number} {title}')

                      qid=int(number)
                      if qid in ids:
                          raise RuntimeError(f'duplicate whole-number quest id in Quests/List: {qid}')
                      ids.append(qid)
                      titles.append(title)

                  titles=dedupe(titles)

                  # Read the Wiki's own declared current totals independently.
                  qr=session.get(summary_url,timeout=(5,25))
                  qr.raise_for_status()
                  summary_text=clean(BeautifulSoup(qr.text,'lxml').get_text(' ',strip=True))
                  m_total=re.search(r'(?i)there are a total of\s+(\d+)\s+quests',summary_text)
                  m_split=re.search(r'(?i)with\s+(\d+)\s+free(?:-to-play)?\s+and\s+(\d+)\s+member',summary_text)
                  declared=int(m_total.group(1)) if m_total else None
                  declared_free=int(m_split.group(1)) if m_split else None
                  declared_members=int(m_split.group(2)) if m_split else None

                  if declared is None:
                      raise RuntimeError('could not read declared current quest total from OSRS Quests page')
                  if len(titles)!=declared:
                      raise RuntimeError(
                          f'Quests/List whole-number rows do not match declared total: '
                          f'extracted={len(titles)} declared={declared} '
                          f'decimal_subquests_skipped={len(skipped_decimal)}'
                      )
                  if declared_free is not None and declared_members is not None:
                      if declared_free + declared_members != declared:
                          raise RuntimeError(
                              f'Wiki quest split is internally inconsistent: '
                              f'free={declared_free} members={declared_members} total={declared}'
                          )

                  if titles.count('Recipe for Disaster')!=1:
                      raise RuntimeError('Recipe for Disaster parent quest missing/duplicated in Quests/List')
                  if any(x.startswith('Recipe for Disaster/') for x in titles):
                      raise RuntimeError('Recipe for Disaster subquest leaked into main quest list')
                  if 'Imp Catcher' not in titles or "Cook's Assistant" not in titles:
                      raise RuntimeError('basic known quests missing from authoritative Quest List')
                  if 'Fallen From Grace' not in titles:
                      raise RuntimeError('latest known quest Fallen From Grace missing from authoritative Quest List')

                  print(
                      f'AUTHORITATIVE OSRS MAIN QUEST LIST: {len(titles)} quests '
                      f'(declared={declared}, free={declared_free}, members={declared_members}, '
                      f'RFD decimal subquest rows skipped={len(skipped_decimal)})',
                      flush=True
                  )
                  return titles

              except Exception as exc:
                  raise RuntimeError('Could not obtain a trustworthy OSRS Quests/List index: '+repr(exc))

          def canonical_quest_titles():
              """Build the main OSRS quest index independently of walkthrough/reward parsing.

              Sources, in order:
              1. Local RuneLite Quest Helper clone.
              2. Raw GitHub QuestVarPlayer.java + QuestVarbits.java network fallback.
              3. OSRS Wiki Quests/List merge.

              This deliberately does NOT use reward text to decide whether an entry is a quest.
              """

              authoritative=authoritative_main_quest_titles()
              if authoritative:
                  return authoritative

              raw_seed=json.loads(SRC.read_text(encoding='utf-8'))
              seed_by_key={}
              for q in raw_seed:
                  n=clean(q.get('name',''))
                  if n:
                      seed_by_key.setdefault(re.sub(r'[^a-z0-9]','',n.lower()),n)

              enum_alias={
                  'blackknightsfortress':"Black Knights' Fortress",
                  'cooksassistant':"Cook's Assistant",
                  'doricsquest':"Doric's Quest",
                  'dragonslayeri':'Dragon Slayer I',
                  'heroesquest':"Heroes' Quest",
                  'legendsquest':"Legends' Quest",
                  'monkeymadnessi':'Monkey Madness I',
                  'monkeymadnessii':'Monkey Madness II',
                  'deserttreasure':'Desert Treasure I',
                  'deserttreasureii':'Desert Treasure II - The Fallen Empire',
                  'fairytaleigrowingpains':'Fairytale I - Growing Pains',
                  'fairytaleiicureaqueen':'Fairytale II - Cure a Queen',
                  'elementalworkshopi':'Elemental Workshop I',
                  'elementalworkshopii':'Elemental Workshop II',
                  'mourningsendparti':"Mourning's End Part I",
                  'mourningsendpartii':"Mourning's End Part II",
                  'recipefordisaster':'Recipe for Disaster',
              }

              def enum_to_candidate(enum):
                  e=re.sub(r'_STATE_\d+$','',enum)
                  key=re.sub(r'[^a-z0-9]','',e.lower())

                  # RuneLite exposes Recipe for Disaster subquest/helper varbits such as
                  # RECIPE_FOR_DISASTER_DWARF. They are parts of quest #100, not separate
                  # entries in QuestMate's main quest list.
                  if key.startswith('recipefordisaster') and key!='recipefordisaster':
                      return None

                  # Shield of Arrav path helpers are also branches of one quest.
                  if key.startswith('shieldofarrav') and key!='shieldofarrav':
                      return None

                  if key in enum_alias:
                      return enum_alias[key]
                  if key in seed_by_key:
                      return seed_by_key[key]
                  words=e.lower().split('_')
                  small={'of','the','and','a','an','to','in','at','for','on'}
                  return ' '.join(w if w in small else w.capitalize() for w in words)

              def strip_after_miniquests(s):
                  low=s.lower()
                  cuts=[]
                  for marker in ('miniquest', 'mini-quest', 'mini quest'):
                      i=low.find(marker)
                      if i >= 0:
                          cuts.append(i)
                  return s[:min(cuts)] if cuts else s

              def extract_enums(s):
                  s=strip_after_miniquests(s)
                  found=[]
                  for enum in re.findall(r'\bQUEST_([A-Z][A-Z0-9_]*)\s*\(',s):
                      if enum == 'TAB':
                          continue
                      if re.search(r'_STATE_\d+$',enum):
                          continue
                      found.append(enum)
                  return found

              def fetch_text(url):
                  try:
                      r=session.get(url,timeout=25)
                      if r.status_code==200 and 'QUEST_' in r.text:
                          return r.text
                  except Exception as exc:
                      print('Network source unavailable:',url,repr(exc))
                  return ''

              def runelite_enums():
                  enums=[]
                  info_root=Path('/tmp/quest-helper/src/main/java/com/questhelper/questinfo')
                  local_ok=False
                  for fn in ('QuestVarPlayer.java','QuestVarbits.java'):
                      f=info_root/fn
                      if f.exists():
                          s=f.read_text(encoding='utf-8',errors='ignore')
                          got=extract_enums(s)
                          if got:
                              local_ok=True
                              enums.extend(got)

                  # GitHub raw fallback makes this independent of git-clone success.
                  if not local_ok or len(set(enums)) < 100:
                      base='https://raw.githubusercontent.com/Zoinkwiz/quest-helper/master/src/main/java/com/questhelper/questinfo/'
                      for fn in ('QuestVarPlayer.java','QuestVarbits.java'):
                          s=fetch_text(base+fn)
                          if s:
                              enums.extend(extract_enums(s))

                  enums=list(dict.fromkeys(enums))
                  print(f'RuneLite main-quest enum entries discovered: {len(enums)}')
                  return enums

              def wiki_list_titles():
                  try:
                      markup=wiki_parse('Quests/List')
                      soup=safe_soup(markup)
                      if soup is None:
                          return []
                      titles=[]
                      # Accept all quest tables, but only rows from a table with a
                      # Quest/Name header. Exclude miniquest-labelled tables/sections.
                      for table in soup.find_all('table'):
                          heading=table.find_previous(['h2','h3'])
                          heading_text=clean(heading.get_text(' ',strip=True)).lower() if heading else ''
                          if 'miniquest' in heading_text or 'mini-quest' in heading_text:
                              continue
                          rows=table.find_all('tr')
                          if not rows:
                              continue
                          qcol=None
                          for tr in rows[:5]:
                              cells=tr.find_all(['th','td'],recursive=False)
                              labs=[clean(c.get_text(' ',strip=True)).lower() for c in cells]
                              for i,lab in enumerate(labs):
                                  if lab in ('quest','name') or lab.startswith('quest '):
                                      qcol=i
                                      break
                              if qcol is not None:
                                  break
                          if qcol is None:
                              continue
                          for tr in rows:
                              cells=tr.find_all(['th','td'],recursive=False)
                              if qcol>=len(cells):
                                  continue
                              cell=cells[qcol]
                              a=cell.find('a',href=True)
                              if not a:
                                  continue
                              t=clean(a.get('title') or a.get_text(' ',strip=True))
                              if not t or t.startswith(('File:','Category:','Template:','Help:','Special:')):
                                  continue
                              if '/Quick guide' in t or '/Strategy' in t:
                                  continue
                              titles.append(t)
                      titles=dedupe(titles)
                      print(f'OSRS Wiki quest-list titles discovered: {len(titles)}')
                      return titles
                  except Exception as exc:
                      print('Wiki quest index unavailable:',repr(exc))
                      return []

              rl_names=[x for x in (enum_to_candidate(e) for e in runelite_enums()) if x]
              wiki_names=wiki_list_titles()
              titles=dedupe(wiki_names+rl_names)

              deny={
                  'quest tab','architectural alliance','bear your soul','curse of the empty lord',
                  'enchanted key',"the general's shadow",'skippy and the mogres',
                  'lair of tarn razorlor','family pest','the mage arena ii','in search of knowledge',
                  "daddy's home","hopespear's will",'vale totems','his faithful servants',
                  'barbarian training','knight waves training grounds','stronghold of security'
              }
              def is_real_main_quest_title(t):
                  t=clean(t)
                  low=t.lower()
                  if not t or low in deny:
                      return False
                  # Wiki category/index/subpage links are not quests.
                  if low.startswith('quests/'):
                      return False
                  if low in {
                      'quests','quest list','quest points','quest difficulties',
                      'optimal quest guide','quest experience','experienced',
                      'grandmaster','intermediate','master','novice','special'
                  }:
                      return False
                  # A slash title is a Wiki subpage/subquest/guide, not a separate main
                  # quest entry. Recipe for Disaster subquests stay inside Recipe for Disaster.
                  if '/' in t:
                      return False

                  # RuneLite helper/varbit display names for branches must also remain inside
                  # their parent quest rather than appearing as fake standalone quests.
                  if low.startswith('recipe for disaster ') and low!='recipe for disaster':
                      return False
                  if low.startswith('shield of arrav ') and low!='shield of arrav':
                      return False
                  return True

              titles=[t for t in titles if is_real_main_quest_title(t)]
              titles=dedupe(titles)

              # Hard invariant: RFD is exactly one main quest entry.
              rfd_like=[t for t in titles if title_key(t).startswith(title_key('Recipe for Disaster'))]
              if rfd_like != ['Recipe for Disaster']:
                  raise RuntimeError('Canonical quest index contains Recipe for Disaster subquest/helper entries: '+repr(rfd_like))

              required={"Cook's Assistant",'Demon Slayer','Dragon Slayer I','Recipe for Disaster',
                        'Desert Treasure II - The Fallen Empire'}

              # v28: Never let a temporary RuneLite/Wiki quest-index parser failure collapse
              # the application to one or a handful of quests. The embedded seed contains
              # both main quests and helper/sub-guide entries, so use a strict main-quest
              # filter as an offline canonical-index fallback. Live Wiki/RuneLite discovery
              # still wins whenever it returns a healthy list.
              def seed_main_quest_fallback():
                  helper_exact={
                      'bear your soul','enter the abyss','in search of knowledge',
                      'agility dungeon steps','altar puzzle','amlodd light puzzle','ask about fish cake',
                      'ask about ritual','baxtorian pillar','bring drezel pure essence step','bring lunar items',
                      'cadarn light puzzle','castle drakan','castle drakan room step','chance challenge',
                      'chest code step','current affairs','crwys light puzzle','crypt puzzle','dye ship steps',
                      'egg solver','feeding aimeri','find longramble','fish monkfish','fix wall','get rohak drunk',
                      'give auguste items','give ingredients to helpers step','give items','hazeel valves',
                      'hefin light puzzle','herblore puzzle','inform king bolren','iorwerth light puzzle',
                      'jug puzzle','kill trolls','locked chest puzzle','m m2 sabotage','make evil stew',
                      'meilyr light puzzle','memory puzzle','metal door solver','mimic challenge','miss cheevers step',
                      'monolith puzzle','ms hynn answer dialog quiz step','pandemonium','perseriya steps',
                      'potion puzzle','prying times','puzzle step','quiz steps','rat charming','repair town',
                      'rubble solver','rum smuggling step','scrambled','selecting combat gear','sir ren itchood step',
                      'skavid choice','slug steps','solve chest code','starting off','statue puzzle','sucellus steps',
                      'tomb riddle','trahaearn light puzzle','tree solver','unveil evil','valve step',
                      'vardorvis steps','weight step','whisperer steps','yewnocks puzzle'
                  }
                  rfd_prefix='r f d '
                  shield_parts={'shield of arrav black arm gang','shield of arrav phoenix gang'}
                  fallback=[]
                  for seed_name in seed_by_key.values():
                      n=clean(seed_name)
                      low=n.lower()
                      if not n or low in helper_exact or low.startswith(rfd_prefix) or low in shield_parts:
                          continue
                      if re.search(r'(?i)\b(?:puzzle|solver|sub-?guide)\b|\bsteps?$',n):
                          continue
                      fallback.append(NAME_FIX.get(n,n))

                  # Parent quest entries represented as multiple helper files in RuneLite.
                  fallback.extend(['Recipe for Disaster','Shield of Arrav'])

                  # Canonical display aliases for seed naming variants.
                  alias={
                      'A Souls Bane':"A Soul's Bane",
                      'A Tail Of Two Cats':'A Tail of Two Cats',
                      'A Taste Of Hope':'A Taste of Hope',
                      'A Night At The Theatre':'A Night at the Theatre',
                      'A Porcine Of Interest':'A Porcine of Interest',
                      'Another Slice Of Ham':'Another Slice of H.A.M.',
                      'Between A Rock':'Between a Rock...',
                      'Cooks Assistant':"Cook's Assistant",
                      'Desert Treasure':'Desert Treasure I',
                      'Desert Treasure I I':'Desert Treasure II - The Fallen Empire',
                      'Dorics Quest':"Doric's Quest",
                      'Dragon Slayer':'Dragon Slayer I',
                      'Dragon Slayer I I':'Dragon Slayer II',
                      'Eadgars Ruse':"Eadgar's Ruse",
                      'Eagles Peak':"Eagles' Peak",
                      'Elemental Workshop I I':'Elemental Workshop II',
                      'Fairytale I':'Fairytale I - Growing Pains',
                      'Fairytale I I':'Fairytale II - Cure a Queen',
                      'Gertrudes Cat':"Gertrude's Cat",
                      'Heroes Quest':"Heroes' Quest",
                      'Icthlarins Little Helper':"Icthlarin's Little Helper",
                      'Kings Ransom':"King's Ransom",
                      'Legends Quest':"Legends' Quest",
                      'Merlins Crystal':"Merlin's Crystal",
                      'Monks Friend':"Monk's Friend",
                      'Mournings End Part I':"Mourning's End Part I",
                      'Mournings End Part I I':"Mourning's End Part II",
                      'My Arms Big Adventure':"My Arm's Big Adventure",
                      'Olafs Quest':"Olaf's Quest",
                      'Pirates Treasure':"Pirate's Treasure",
                      'Rag And Bone Man I':'Rag and Bone Man I',
                      'Rag And Bone Man I I':'Rag and Bone Man II',
                      'Shades Of Mortton':'Shades of Mort’ton',
                      'The Knights Sword':"The Knight's Sword",
                      'Twilights Promise':"Twilight's Promise",
                      'Witchs House':"Witch's House",
                      'Witchs Potion':"Witch's Potion",
                  }
                  fallback=[alias.get(x,x) for x in fallback]
                  return dedupe(fallback)

              def req_missing(values):
                  keys={title_key(v) for v in values}
                  return sorted(r for r in required if title_key(r) not in keys)

              missing=req_missing(titles)
              if len(titles)<150 or missing:
                  offline=seed_main_quest_fallback()
                  print(
                      f'Canonical live index unhealthy (discovered={len(titles)}, missing={missing}); '
                      f'merging {len(offline)} filtered embedded main-quest fallback titles.'
                  )
                  titles=dedupe(titles+offline)

              # Required anchor quests are inserted explicitly only after the filtered
              # fallback merge, so punctuation/roman-numeral differences can never make
              # the whole build fail before guide enrichment starts.
              existing_keys={title_key(v) for v in titles}
              for r in sorted(required):
                  if title_key(r) not in existing_keys:
                      titles.append(r)
                      existing_keys.add(title_key(r))

              if len(titles)<150:
                  raise RuntimeError(
                      f'Canonical main-quest index remains implausibly small after live + embedded fallback merge: '
                      f'{len(titles)} titles. Refusing to ship a truncated quest list.'
                  )

              print(f'Canonical main quests discovered/merged: {len(titles)}')
              return dedupe(titles)

          def title_key(title):
              return re.sub(r'[^a-z0-9]','',clean(title).lower())

          F2P_QUESTS={
              title_key(x) for x in (
              "Below Ice Mountain","Black Knights' Fortress","Cook's Assistant","Demon Slayer",
              "Doric's Quest","Dragon Slayer I","Ernest the Chicken","Goblin Diplomacy","Imp Catcher",
              "Misthalin Mystery","Pirate's Treasure","Prince Ali Rescue","Romeo & Juliet",
              "Rune Mysteries","Sheep Shearer","Shield of Arrav","The Corsair Curse","The Ides of Milk",
              "The Knight's Sword","The Restless Ghost","Vampyre Slayer","Witch's Potion","X Marks the Spot")
          }

          def seed_index():
              raw=json.loads(SRC.read_text(encoding='utf-8'))
              out={}
              for q in raw:
                  raw_name=clean(q.get('name',''))
                  name=NAME_FIX.get(raw_name,raw_name)
                  for n in (raw_name,name):
                      k=title_key(n)
                      if k and k not in out: out[k]=q
              # Display-name aliases used by canonical_quest_titles().
              alias_pairs={
                  "Cook's Assistant":'Cooks Assistant',
                  "Black Knights' Fortress":'Black Knight Fortress',
                  'Dragon Slayer I':'Dragon Slayer',
                  'Desert Treasure I':'Desert Treasure',
                  'Desert Treasure II - The Fallen Empire':'Desert Treasure I I',
                  'Dragon Slayer II':'Dragon Slayer I I',
              }
              for display,seed_name in alias_pairs.items():
                  src=out.get(title_key(seed_name))
                  if src is not None:
                      out[title_key(display)]=src
              return out

          def is_complete_main_quest(q):
              # Membership is determined only by the canonical main-quest index. Guide
              # quality is validated separately so a real quest can never silently vanish.
              return True

          seeds=seed_index()
          titles=canonical_quest_titles()
          print(f'Canonical quests to audit: {len(titles)}', flush=True)
          assert len(titles)==len(set(titles)), 'Duplicate quest titles in authoritative list'
          assert all('/' not in x for x in titles), 'Subpage/subquest title leaked into authoritative main quest list'
          print('Canonical quest-list integrity checks PASS.', flush=True)
          print("STAGE 1/3: downloading exact quest source pages...", flush=True)
          prefetch_wiki_pages(titles)
          print("STAGE 2/3: rebuilding and validating every quest locally...", flush=True)
          rebuilt=[]; audit=[]; semantic_refs={}
          counts={'wiki':0,'runelite':0,'seed':0,'weak':0,'missing_rewards':0}

          for idx,title in enumerate(titles,1):
              q0=seeds.get(title_key(title),{})
              q=dict(q0)
              q['name']=title
              q.pop('wikiUrl',None); q.pop('source',None)
              canonical,quick,full=fetch_wiki(title)
              if not quick or not full:
                  quick,full=retry_missing_exact_pages(canonical,quick,full)
              # Keep the exact official Quests/List title as the app heading. fetch_wiki is
              # used only for walkthrough content, never to create extra/non-quest entries.

              quick_steps=strip_generic_steps(parse_walkthrough(quick) if quick else [])
              if title_key(q['name'])==title_key('Recipe for Disaster'):
                  full_steps=strip_generic_steps(parse_rfd_full_walkthrough(full) if full else [])
                  if not full_steps:
                      # Retain the older generic compound parser as a fallback, but never
                      # let it be the only RFD strategy.
                      full_steps=strip_generic_steps(parse_all_walkthrough_sections(full) if full else [])
              else:
                  full_steps=strip_generic_steps(parse_walkthrough(full) if full else [])
              runelite=strip_generic_steps(qh_steps(q['name']))
              seed=strip_generic_steps(good_seed_steps(q))

              # Expand each candidate independently. A broken sub-guide pointer in one
              # source must not abort all 189 quests; that candidate is rejected instead.
              candidate_errors=[]
              quick_steps,err=safe_expand_candidate(quick_steps,full,quick,q['name'],'OSRS Wiki quick guide')
              if err: candidate_errors.append(err)
              full_steps,err=safe_expand_candidate(full_steps,full,quick,q['name'],'OSRS Wiki full guide')
              if err: candidate_errors.append(err)
              runelite,err=safe_expand_candidate(runelite,full,quick,q['name'],'RuneLite Quest Helper')
              if err: candidate_errors.append(err)
              seed,err=safe_expand_candidate(seed,full,quick,q['name'],'embedded Quest Helper seed')
              if err: candidate_errors.append(err)

              choices=[
                  ('OSRS Wiki full guide', full_steps),
                  ('OSRS Wiki quick guide', quick_steps),
                  ('RuneLite Quest Helper exact match', runelite),
                  ('embedded verified fallback', seed),
              ]
              viable=[pair for pair in choices if pair[1] and detail_score(pair[1])>-100000]
              if not viable:
                  # Do not abort here. The workflow has a later independent exact-source
                  # recovery pass specifically for this situation. Preserve the quest record,
                  # requirements/items/rewards/start metadata, mark the guide for repair, and
                  # let the repair stage try cached Wiki, exact Wiki mirror and reviewed data.
                  source='DEFERRED TO EXACT-SOURCE REPAIR'
                  best=[]
                  q['needsDetailRepair']=True
                  print(
                      f"DEFERRED WALKTHROUGH: {q['name']} had no viable initial parser candidate. "
                      f"The quest remains in the database and will be repaired before shipping. "
                      f"Candidate failures: {' | '.join(candidate_errors) or 'none reported'}",
                      flush=True
                  )
              else:
                  full_pair=next((p for p in viable if p[0]=='OSRS Wiki full guide'),None)
                  quick_pair=next((p for p in viable if p[0]=='OSRS Wiki quick guide'),None)
                  if full_pair and detail_score(full_pair[1])>=45:
                      source,best=full_pair
                  elif quick_pair and detail_score(quick_pair[1])>=25:
                      source,best=quick_pair
                  else:
                      source,best=max(viable,key=lambda pair:detail_score(pair[1]))
              q['steps']=strip_generic_steps(best)

              # Recipe for Disaster must be the parent quest with a combined guide, never one
              # isolated helper branch such as "Dwarf". Require substantial coverage.
              if title_key(q['name'])==title_key('Recipe for Disaster'):
                  joined=' '.join(x.get('section','')+' '+x.get('text','') for x in q['steps']).lower()
                  required_rfd_terms=('another cook','mountain dwarf','goblin','pirate pete','lumbridge guide','evil dave','skrach','sir amik','awowogei','culinaromancer')
                  missing=[x for x in required_rfd_terms if x not in joined]
                  if missing or len(q['steps'])<35:
                      q['needsDetailRepair']=True
                      print(
                          f"DEFERRED RFD COMPOUND GUIDE: initial RFD parser produced "
                          f"{len(q['steps'])} steps; missing sections={missing}. "
                          "The exact /Full guide recovery stage will rebuild all 10 parts before shipping.",
                          flush=True
                      )
                  else:
                      print(f'RFD combined guide PASS: {len(q["steps"])} steps across all explicit Walkthrough sections',flush=True)

              if source=='OSRS Wiki': counts['wiki']+=1
              elif source.startswith('RuneLite Quest Helper'): counts['runelite']+=1
              else: counts['seed']+=1

              if title_key(q['name'])==title_key('Recipe for Disaster'):
                  wiki_items=parse_all_items(full) or parse_items(quick) or parse_items(full)
              else:
                  wiki_items=parse_items(quick) or parse_items(full)
              items=wiki_items or q.get('items',[])
              q['items']=dedupe(items)
              q['itemSource']='OSRS Wiki Items required' if wiki_items else 'embedded verified fallback'
              q['places']=dedupe(q.get('places',[]))
              if title_key(q['name'])==title_key('Recipe for Disaster'):
                  req_all,skill_req,quest_req=parse_requirements(full,titles)
                  if not req_all:
                      req_all,skill_req,quest_req=parse_requirements(quick,titles)
              else:
                  req_all,skill_req,quest_req=parse_requirements(quick or full,titles)
                  if not req_all:
                      req_all,skill_req,quest_req=parse_requirements(full,titles)
              rl_skills,rl_quests=qh_requirements(q['name'],titles)
              quest_req=[x for x in quest_req if title_key(x)!=title_key(q['name'])]
              # v59 authority rule: only the Wiki Requirements row drives the actual app and
              # fresh-account Quest Cape route. RuneLite is an exact-match independent check.
              q['requirements']=req_all
              q['skillRequirements']=dict(skill_req)
              q['questRequirements']=dedupe(quest_req)
              q['requirementsVerification']={
                  'authoritativeSource':'OSRS Wiki Requirements row',
                  'wikiSkillRequirements':skill_req,
                  'runeliteSkillRequirements':rl_skills,
                  'wikiQuestRequirements':quest_req,
                  'runeliteQuestRequirements':rl_quests,
