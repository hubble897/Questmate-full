                          set_level(sk,target)
                      new.append({'type':'training','title':'SKILL TRAINING BEFORE '+q['name'],'detail':' '.join(details)}); checkpoints+=1
                  new.append(row); completed.add(q['name']); apply_fixed_xp(q); continue
              new.append(row)
          R.write_text(json.dumps(new,ensure_ascii=False,separators=(',',':')),encoding='utf-8')
          Path('questmate-complete/fresh-account-route-report.txt').write_text(
              f'XP-aware fresh-account training checkpoints: {checkpoints}\nPrerequisite checks: {prereq_checks}\nQuests simulated: {len(completed)}\nFixed named-skill quest XP applied; variable/choice XP not assumed.\n',encoding='utf-8')
          print(Path('questmate-complete/fresh-account-route-report.txt').read_text())
          assert checkpoints>0
          PYEOF

