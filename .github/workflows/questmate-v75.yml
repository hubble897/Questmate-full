      - name: Semantic source-consistency audit for EVERY quest
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,re,math
          from pathlib import Path

          DB=Path('questmate-complete/app/src/main/assets/quests.json')
          REF=Path('questmate-complete/semantic-reference.json')
          OUT=Path('questmate-complete/all-quest-semantic-audit.txt')

          quests=json.load(open(DB,encoding='utf-8'))
          refs=json.load(open(REF,encoding='utf-8'))
          by={q['name']:q for q in quests}

          STOP={
            'the','and','for','with','from','into','onto','your','you','then','that','this','there',
            'have','has','had','will','can','could','should','would','after','before','back','return',
            'speak','talk','use','using','take','bring','give','get','go','make','open','enter','leave',
            'walk','run','climb','head','travel','continue','follow','through','towards','toward',
            'quest','guide','step','steps','complete','completion','start','starting','finish','finished',
            'area','room','door','item','items','required','requirement','requirements','reward','rewards',
            'player','players','one','two','three','four','five','some','any','another','same','first',
            'second','next','last','until','once','when','where','which','while','about','around','near',
            'north','south','east','west','upstairs','downstairs','floor','level'
          }
          ITEM_GENERIC={'combat','equipment','food','recommended','optional','coins','coin','runes','rune',
                        'teleport','teleports','stamina','potion','potions','antipoison','weapon','weapons',
                        'armour','armor','prayer','restore','energy','source','light'}

          def clean(x):
              return re.sub(r'\s+',' ',str(x or '')).strip()

          def norm_words(text,extra_stop=None):
              stop=STOP | (extra_stop or set())
              words=re.findall(r"[a-z0-9]+(?:'[a-z0-9]+)?",clean(text).lower())
              return {w for w in words if len(w)>=4 and w not in stop and not w.isdigit()}

          def overlap(a,b):
              aa=norm_words(a); bb=norm_words(b)
              if not aa or not bb:return 0.0,0
              common=aa & bb
              return len(common)/max(1,min(len(aa),len(bb))),len(common)

          def steps_text(steps):
              return ' '.join(clean(x.get('section',''))+' '+clean(x.get('text','')) for x in (steps or []))

          def ref_walkthrough(ref):
              # Prefer independent Wiki evidence. RuneLite is fallback/cross-check only.
              full=ref.get('wikiFullSteps') or []
              quick=ref.get('wikiQuickSteps') or []
              rl=ref.get('runeliteSteps') or []
              if len(full)>=3:return 'Wiki full',full
              if len(quick)>=2:return 'Wiki quick',quick
              if len(rl)>=2:return 'RuneLite exact',rl
              if full:return 'Wiki full',full
              if quick:return 'Wiki quick',quick
              return 'RuneLite exact',rl

          def item_key(text):
              # Remove quantities and generic qualifier language while preserving the actual item.
              t=clean(text).lower()
              t=re.sub(r'^\s*\d[\d,]*\s*[x×]?\s*','',t)
              t=re.sub(r'\([^)]*\)',' ',t)
              words=[w for w in re.findall(r"[a-z0-9']+",t)
                     if len(w)>=3 and w not in STOP and w not in ITEM_GENERIC and not w.isdigit()]
              return set(words)

          def item_matches(source_item,final_items,walkthrough):
              src=item_key(source_item)
              if not src:
                  return True
              for item in final_items:
                  dst=item_key(item)
                  if src & dst and len(src & dst)>=max(1,min(2,len(src))):
                      return True
              walk=norm_words(walkthrough,ITEM_GENERIC)
              return bool(src & walk and len(src & walk)>=max(1,min(2,len(src))))

          def numeric_facts(text):
              # Numbers worth preserving: quantities, XP, coins, levels, quest points.
              facts=[]
              for m in re.finditer(r'(?i)\b(\d[\d,]*)\b.{0,25}\b(xp|experience|coins?|quest points?|levels?|items?|runes?|logs?|bars?|beads?|bread|trout)\b',clean(text)):
                  facts.append((m.group(1).replace(',',''),m.group(2).lower()))
              return facts

          contamination=re.compile(
              r'(?i)\b(?:buy limit|exchange limit|high alch|low alch|store price|'
              r'options\s*[—:\-]\s*(?:wear|drop|use|wield|eat)|'
              r'ge price|grand exchange price|weight\s*[:\-]\s*\d)'
          )
          placeholder=re.compile(
              r'(?i)\b(?:todo|tbd|placeholder|unknown|relevant npc|relevant location|'
              r'do step|follow wiki|see wiki|use wiki|complete this step)\b'
          )

          hard=[]
          warnings=[]
          lines=[]
          passed=0

          for q in quests:
              name=q['name']
              ref=refs.get(name)
              qe=[]; qw=[]
              if ref is None:
                  qe.append('missing independent source-evidence record')
                  ref={}
              final_steps=q.get('steps') or []
              final_text=steps_text(final_steps)
              final_items=q.get('items') or []
              final_rewards=q.get('rewards') or []

              # 1) Requirements: exact source consistency. These drive both quest pages
              # and the fresh-account Quest Cape levelling route, so disagreement is fatal.
              wiki_skills=ref.get('wikiSkillRequirements') or {}
              wiki_quests=ref.get('wikiQuestRequirements') or []
              if q.get('skillRequirements',{}) != wiki_skills:
                  qe.append(f"skill requirements differ from authoritative Wiki evidence: app={q.get('skillRequirements',{})} wiki={wiki_skills}")
              if set(q.get('questRequirements',[])) != set(wiki_quests):
                  qe.append(f"prerequisite quests differ from authoritative Wiki evidence: app={q.get('questRequirements',[])} wiki={wiki_quests}")

              # 2) Starting point: when the Wiki supplied a start point, the displayed
              # start or early walkthrough must retain its distinctive location/NPC terms.
              wiki_start=clean(ref.get('wikiStart',''))
              if wiki_start:
                  early=steps_text(final_steps[:5])
                  ratio,count=overlap(wiki_start,clean(q.get('start',''))+' '+early)
                  if count==0:
                      qe.append(f'quest start has no semantic overlap with Wiki start: {wiki_start!r}')
                  elif ratio<0.20:
                      qw.append(f'low start-point semantic overlap ({ratio:.2f})')

              # 3) Items: check each Wiki item against final item list OR the actual
              # walkthrough. This catches the Imp Catcher-style foreign-data failure while
              # permitting items obtained during the quest to be explained in the steps.
              wiki_items=ref.get('wikiItems') or []
              unmatched=[x for x in wiki_items if not item_matches(x,final_items,final_text)]
              if wiki_items:
                  missing_ratio=len(unmatched)/len(wiki_items)
                  if missing_ratio>0.35 and len(unmatched)>=2:
                      qe.append(f'{len(unmatched)}/{len(wiki_items)} Wiki item requirements not represented: {unmatched[:8]}')
                  elif unmatched:
                      qw.append(f'Wiki item wording/coverage to review: {unmatched[:8]}')

              # Preserve explicit quantity numbers where the source gave them.
              source_item_text=' '.join(wiki_items)
              final_item_and_steps=' '.join(final_items)+' '+final_text
              missing_numbers=[]
              for number,kind in numeric_facts(source_item_text):
                  if number not in final_item_and_steps.replace(',',''):
                      missing_numbers.append(f'{number} ({kind})')
              if missing_numbers:
                  qw.append('source item quantities/numbers not found verbatim: '+', '.join(missing_numbers[:10]))

              # 4) Walkthrough semantic coverage against independent source steps.
              ref_name,ref_steps=ref_walkthrough(ref)
              ref_text=steps_text(ref_steps)
              if ref_text:
                  ref_terms=norm_words(ref_text)
                  final_terms=norm_words(final_text)
                  common=ref_terms & final_terms
                  coverage=len(common)/max(1,len(ref_terms))
                  # Strong failure only when there is clear evidence of unrelated content.
                  if len(ref_terms)>=12 and len(common)<4 and coverage<0.12:
                      qe.append(f'walkthrough has extremely low semantic overlap with {ref_name}: {len(common)}/{len(ref_terms)} distinctive terms ({coverage:.2%})')
                  elif len(ref_terms)>=12 and coverage<0.25:
                      qw.append(f'walkthrough semantic coverage versus {ref_name} is low: {coverage:.2%}')

                  # First/last source segments should not both disappear.
                  if len(ref_steps)>=4 and len(final_steps)>=2:
                      first_ref=steps_text(ref_steps[:2]); last_ref=steps_text(ref_steps[-2:])
                      _,first_common=overlap(first_ref,steps_text(final_steps[:5]))
                      _,last_common=overlap(last_ref,steps_text(final_steps[-6:]))
                      if first_common==0 and last_common==0:
                          qw.append(f'neither beginning nor ending segment overlaps {ref_name}; review sequencing')

              # 5) RuneLite exact helper is an independent semantic cross-check when present.
              rl_steps=ref.get('runeliteSteps') or []
              if rl_steps:
                  rl_terms=norm_words(steps_text(rl_steps))
                  app_terms=norm_words(final_text)
                  common=rl_terms & app_terms
                  if len(rl_terms)>=8 and len(common)<2:
                      qw.append(f'low exact RuneLite helper overlap: {len(common)}/{len(rl_terms)} distinctive terms')

              # 6) Rewards: all numeric Wiki reward facts should survive the merged final list.
              wiki_rewards=ref.get('wikiRewards') or []
              source_reward_text=' '.join(wiki_rewards)
              final_reward_text=' '.join(final_rewards)
              missing_reward_numbers=[]
              for number,kind in numeric_facts(source_reward_text):
                  if number not in final_reward_text.replace(',',''):
                      missing_reward_numbers.append(f'{number} ({kind})')
              if missing_reward_numbers:
                  qe.append('numeric Wiki reward facts missing from final rewards: '+', '.join(missing_reward_numbers[:10]))

              # 7) Generic semantic corruption checks for every quest.
              meta_matches=[]
              for st in final_steps:
                  text=clean(st.get('text',''))
                  m=contamination.search(text)
                  if m: meta_matches.append((m.group(0),text))
              if meta_matches:
                  qe.append(
                      'item/database metadata leaked into walkthrough: '
                      + ' | '.join(f"{kind}: {text[:160]}" for kind,text in meta_matches[:5])
                  )
              if placeholder.search(final_text):
                  qe.append('placeholder or external-guide shortcut remains')
              if len(final_steps)==0 or len(final_text)<40:
                  qe.append('walkthrough has insufficient actionable content')
              if not q.get('start','').strip():
                  qe.append('missing start information')
              if not final_rewards:
                  qe.append('missing rewards')
              if q.get('membership') not in ('F2P','P2P'):
                  qe.append('invalid membership classification')

              # 8) Reward title colours must be caused by the actual reward list only.
              reward_low=final_reward_text.lower()
              defxp=bool(re.search(r'\bdefen[cs]e\b.{0,50}\b(?:xp|experience)\b|\b(?:xp|experience)\b.{0,50}\bdefen[cs]e\b',reward_low,re.I))
              prayerxp=bool(re.search(r'\bprayer\b.{0,50}\b(?:xp|experience)\b|\b(?:xp|experience)\b.{0,50}\bprayer\b',reward_low,re.I))
              if bool(q.get('defenceReward')) != defxp:
                  qw.append('Defence title-colour metadata differs from reward-text semantic scan')
              if bool(q.get('prayerReward')) != prayerxp:
                  qw.append('Prayer title-colour metadata differs from reward-text semantic scan')

              # 9) If RuneLite and Wiki disagree, do not silently merge the RuneLite-only
              # requirement into the app; record it for review instead.
              rl_skills=ref.get('runeliteSkillRequirements') or {}
              rl_quests=ref.get('runeliteQuestRequirements') or []
              for sk,lvl in rl_skills.items():
                  if sk not in wiki_skills:
                      qw.append(f'RuneLite-only skill requirement intentionally NOT imported: {sk} {lvl}')
                  elif int(wiki_skills[sk])!=int(lvl):
                      qw.append(f'Wiki/RuneLite skill disagreement: {sk} Wiki={wiki_skills[sk]} RuneLite={lvl}')
              if set(rl_quests)!=set(wiki_quests) and (rl_quests or wiki_quests):
                  qw.append(f'Wiki/RuneLite prerequisite disagreement: Wiki={wiki_quests} RuneLite={rl_quests}')

              lines.append(f'=== {name} ===')
              lines.append(f'Primary walkthrough source: {ref.get("primarySource","missing")}')
              lines.append(f'Steps={len(final_steps)} Items={len(final_items)} Skills={q.get("skillRequirements",{})} Prereqs={q.get("questRequirements",[])}')
              if qe:
                  for x in qe: lines.append('ERROR: '+x)
              if qw:
                  for x in qw: lines.append('WARNING: '+x)
              if not qe:
                  passed+=1
                  lines.append('SEMANTIC STATUS: PASS')
              lines.append('')

              hard.extend(f'{name}: {x}' for x in qe)
              warnings.extend(f'{name}: {x}' for x in qw)

          # Database/source population must match exactly.
          missing_ref=sorted(set(by)-set(refs))
          extra_ref=sorted(set(refs)-set(by))
          if missing_ref: hard.append('quests missing semantic source evidence: '+', '.join(missing_ref))
          if extra_ref: warnings.append('unused semantic source evidence: '+', '.join(extra_ref))

          OUT.write_text(
              'QUESTMATE v71 ALL-QUEST SEMANTIC AUDIT\n'
              f'Quests audited: {len(quests)}\n'
              f'Quests without hard semantic errors: {passed}/{len(quests)}\n'
              f'Hard semantic errors: {len(hard)}\n'
              f'Review warnings: {len(warnings)}\n\n'
              +'\n'.join(lines)
              +'\n\nGLOBAL WARNINGS\n'+'\n'.join(warnings),
              encoding='utf-8'
          )

          print(f'ALL-QUEST SEMANTIC AUDIT: {passed}/{len(quests)} quests passed hard semantic checks; warnings={len(warnings)}')
          if warnings:
              print('First semantic warnings:')
              for x in warnings[:40]: print(' WARNING:',x)
          if hard:
              print('SEMANTIC ERRORS — APK WILL NOT BUILD:')
              for x in hard[:100]: print(' ERROR:',x)
              raise SystemExit(f'{len(hard)} hard semantic source-consistency errors found across the quest database')
          print('ALL QUESTS PASSED HARD SEMANTIC SOURCE-CONSISTENCY CHECKS')
          PY

      - name: Targeted semantic regression checks for historically problematic quests
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,re
          data=json.load(open('questmate-complete/app/src/main/assets/quests.json',encoding='utf-8'))
          by={q['name']:q for q in data}
          failures=[]

          def require(condition,message):
