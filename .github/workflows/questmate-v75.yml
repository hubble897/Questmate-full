          def patch_demon_slayer(q):
              """Ensure Demon Slayer explains the personalised incantation correctly.

              The incantation sequence is randomised for each player. QuestMate must never
              present one universal answer or require a particular word sequence. The guide
              instead tells the player to record the sequence shown during Aris's vision
              and to ask Aris to repeat it if it was forgotten.
              """
              final_instruction=(
                  "Wield Silverlight and defeat Delrith at the stone circle south of Varrock. "
                  "When the banishment dialogue appears, enter the magical incantation in the "
                  "exact order shown for YOUR character during Aris's vision earlier in the quest. "
                  "The sequence varies from player to player, so do not use a fixed sequence from another guide. "
                  "If you forgot your sequence, return to Aris in Varrock Square and ask her to repeat the magical incantation, "
                  "then return to Delrith and use that personalised order to banish him."
              )
              saw_final=False
              for st in q.get('steps',[]):
                  txt=clean(st.get('text',''))
                  low=txt.lower()
                  if 'delrith' in low and ('incantation' in low or 'banish' in low or 'magic word' in low):
                      st['section']='Banish Delrith — use your personalised incantation'
                      st['text']=final_instruction
                      saw_final=True
              if not saw_final:
                  q.setdefault('steps',[]).append({
                      'section':'Banish Delrith — use your personalised incantation',
                      'text':final_instruction
                  })

              reminder=(
                  "When Aris shows Wally defeating Delrith, note or screenshot the magical incantation in the exact order shown. "
                  "That sequence is randomised for your character and is needed at the end of the quest. "
                  "If you lose it, Aris can repeat your incantation later."
              )
              existing=' '.join(clean(x.get('text','')).lower() for x in q.get('steps',[]))
              if not ('random' in existing and 'aris' in existing and ('incantation' in existing or 'magic word' in existing)):
                  pos=1 if len(q.get('steps',[]))>1 else 0
                  q['steps'].insert(pos,{
                      'section':'Important — record your personalised incantation',
                      'text':reminder
                  })
              return q

