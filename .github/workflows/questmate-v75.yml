          if q:
              items=' '.join(q.get('items',[])).lower()
              steps=' '.join(x.get('text','') for x in q.get('steps',[])).lower()
              require(q.get('skillRequirements',{})=={},f"Imp Catcher has bogus skill requirements: {q.get('skillRequirements')}")
              require(q.get('questRequirements',[])==[],f"Imp Catcher has bogus prerequisite quests: {q.get('questRequirements')}")
              for x in ('black bead','red bead','white bead','yellow bead'): require(x in items,f'Imp Catcher missing {x}')
              require('wizard mizgog' in (q.get('start','')+' '+steps).lower(),'Imp Catcher missing Wizard Mizgog')
              require('buy limit' not in steps and 'wear, drop' not in steps,'Imp Catcher contains leaked item-page text')

          q=by.get('Fairytale I - Growing Pains')
          require(q is not None,'Fairytale I - Growing Pains missing')
          if q:
              steps=' '.join(x.get('text','') for x in q.get('steps',[])).lower()
              items=' '.join(q.get('items',[])).lower()
              prereqs=set(q.get('questRequirements',[]))
              require(not re.search(r'(?i)buy limit|exchange limit|high alch|low alch|store price|grand exchange price|options\s*[—:\-]\s*(?:wear|drop|use|wield|eat)',steps),
                      'Fairytale I contains leaked item/database metadata after repair')
              require(q.get('skillRequirements',{})=={},f"Fairytale I incorrectly has hard skill requirements: {q.get('skillRequirements')}")
              for pre in ('Lost City','Nature Spirit','Priest in Peril','The Restless Ghost'):
                  require(pre in prereqs,f'Fairytale I missing prerequisite quest {pre}')
              for item in ('secateurs','spade','ghostspeak','dramen','skull'):
                  require(item in items,f'Fairytale I item list missing {item}')
              for fact in ('martin','fairy godfather','fairy nuff','zandar','malignius','nature spirit','tanglefoot','magic secateurs'):
                  require(fact in steps,f'Fairytale I walkthrough missing {fact}')
              require(('random' in steps or 'assigned' in steps) and 'three' in steps,
                      'Fairytale I does not explain the three personalised/random assigned blessing items')

          q=by.get('Demon Slayer')
          require(q is not None,'Demon Slayer missing')
          if q:
              steps=' '.join(x.get('text','') for x in q.get('steps',[])).lower()
              require('delrith' in steps and 'silverlight' in steps,'Demon Slayer missing Delrith/Silverlight final-fight instructions')
              require('aris' in steps,'Demon Slayer missing Aris reminder/recovery information')
              require(('incantation' in steps or 'magic words' in steps),'Demon Slayer missing incantation guidance')
              require(('random' in steps or 'varies from player to player' in steps or 'varies for each player' in steps),
                      'Demon Slayer does not say the incantation sequence is randomised')
              require(('repeat' in steps or 'remind' in steps or 'forgot' in steps),
                      'Demon Slayer does not explain how to recover a forgotten incantation')

          q=by.get('Death Plateau')
          require(q is not None,'Death Plateau missing')
          if q:
              steps=' '.join(x.get('text','') for x in q.get('steps',[])).lower()
              require(q.get('skillRequirements',{})=={},f"Death Plateau has unexpected skill requirements: {q.get('skillRequirements')}")
              require(q.get('questRequirements',[])==[],f"Death Plateau has unexpected prerequisite quests: {q.get('questRequirements')}")
              for x in ('denulth','eohric','harold','saba','tenzing','dunstan'): require(x in steps,f'Death Plateau walkthrough missing {x}')

          rfd=[q for q in data if re.sub(r'[^a-z0-9]','',q.get('name','').lower()).startswith('recipefordisaster')]
          require(len(rfd)==1,f'Recipe for Disaster population is wrong: {[q.get("name") for q in rfd]}')

          # Mourning's End Part II: puzzle warnings are real instructions, not placeholders.
          q=by.get("Mourning's End Part II")
          require(q is not None,"Mourning's End Part II missing")
          if q:
              steps=' '.join(x.get('text','') for x in q.get('steps',[])).lower()
              require('temple of light' in steps,"Mourning's End Part II missing Temple of Light progression")
              require('mirror' in steps and 'crystal' in steps,"Mourning's End Part II missing mirror/crystal puzzle instructions")
              require('death altar' in steps,"Mourning's End Part II missing Death Altar progression")
              require(('do not reset the puzzle' in steps or 'do not reset' in steps or 'not reset the puzzle' in steps),
                      "Mourning's End Part II missing the important no-reset puzzle warning")
              require('crystal dispenser' in steps,"Mourning's End Part II missing crystal dispenser instructions")

          if failures:
              print('SEMANTIC INTEGRITY FAILURES:')
              for f in failures:
                  print(' -',f)
              raise SystemExit(f'{len(failures)} semantic integrity checks failed')
          print("Semantic integrity checks PASS: Fairytale I, Cook's Assistant, Imp Catcher, Demon Slayer, Death Plateau, Mourning's End Part II, Recipe for Disaster")
          PY

      - name: Cross-check requirements against RuneLite Quest Helper
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/quest-helper
          git clone --depth 1 https://github.com/Zoinkwiz/quest-helper.git /tmp/quest-helper
          python3 - <<'PY'
          import json,re
          from pathlib import Path
          db=Path('questmate-complete/app/src/main/assets/quests.json')
          qs=json.load(open(db,encoding='utf-8'))
          root=Path('/tmp/quest-helper/src/main/java')
          java=list(root.rglob('*.java'))
          def key(x): return re.sub(r'[^a-z0-9]','',x.lower())
          report=[]; matched=0
          # Quest Helper is used as an independent cross-check: its helper files expose
          # SkillRequirement and QuestRequirement objects. Wiki remains the display source.
          for q in qs:
              target=key(q['name'])
              candidates=[p for p in java if key(p.stem)==target]
              if not candidates:
                  candidates=[p for p in java if target in [key(x) for x in p.relative_to(root).parts[:-1]]]
              candidates=sorted(candidates,key=lambda p:len(str(p)))
              if not candidates: continue
              text=candidates[0].read_text(errors='ignore')
              skill_hits=re.findall(r'new\s+SkillRequirement\s*\([^,]+,\s*(\d+)',text)
              quest_hits=re.findall(r'new\s+QuestRequirement\s*\([^,]+,\s*QuestDetails\.([A-Z0-9_]+)',text)
              if skill_hits or quest_hits:
                  matched+=1
                  report.append(f"{q['name']} | helper={candidates[0].name} | skill objects={len(skill_hits)} | quest objects={len(quest_hits)}")
          Path('questmate-complete/runelite-requirements-crosscheck.txt').write_text(
              'RuneLite Quest Helper requirement cross-check\nMatched helper requirement files: '+str(matched)+'\n'+'\n'.join(report),encoding='utf-8')
          print('RuneLite requirement cross-check matched:',matched)
          if matched<=50:
              print('WARNING: RuneLite repository matching is lower than expected; Wiki-derived requirements remain in place and the strict per-quest audit will still run.')
          PY

      - name: Full per-quest accuracy and completeness audit
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,re
          from pathlib import Path

          P=Path('questmate-complete/app/src/main/assets/quests.json')
          R=Path('questmate-complete/app/src/main/assets/cape_route.json')
          qs=json.load(open(P,encoding='utf-8'))
          route=json.load(open(R,encoding='utf-8'))

          BAD=re.compile(r'\b(?:todo|tbd|placeholder|unknown|relevant npc|relevant location|do step|find npc|find location|continue quest|follow wiki|see wiki|use wiki)\b',re.I)
          vague=re.compile(r'^(?:go there|talk to them|continue|finish the quest|complete the quest|do the puzzle|do the fight)\.?$',re.I)
          names={q['name'] for q in qs}
          errors=[]; warnings=[]; rows=[]

          for q in qs:
              e=[]; w=[]
              name=q.get('name','').strip()
              items=q.get('items') or []
              req=q.get('requirements') or []
              skills=q.get('skillRequirements') or {}
              prereq=q.get('questRequirements') or []
              verification=q.get('requirementsVerification') or {}
              start=q.get('start','').strip()
              steps=q.get('steps') or []
              rewards=q.get('rewards') or []

              if not name: e.append('missing quest name')
              if not start: e.append('missing starting location/NPC')
              if len(steps)<2: e.append(f'walkthrough has only {len(steps)} step(s)')
              if not rewards: e.append('missing rewards')
              if q.get('membership') not in ('F2P','P2P'): e.append('invalid F2P/P2P classification')
              if not verification: e.append('missing Wiki/RuneLite requirement cross-check metadata')
              ws=verification.get('wikiSkillRequirements',{}); rs=verification.get('runeliteSkillRequirements',{})
              wq=set(verification.get('wikiQuestRequirements',[])); rq=set(verification.get('runeliteQuestRequirements',[]))
              if skills != ws:
                  e.append('app skill requirements differ from authoritative Wiki requirement set')
              if set(prereq) != wq:
                  e.append('app prerequisite quests differ from authoritative Wiki requirement set')
              for sk in set(ws)|set(rs):
                  if sk in ws and sk in rs and int(ws[sk])!=int(rs[sk]):
                      w.append(f'skill requirement source disagreement for {sk}: Wiki {ws[sk]} vs RuneLite {rs[sk]}')
                  elif sk in rs and sk not in ws:
                      w.append(f'RuneLite-only skill requirement NOT imported into app: {sk} {rs[sk]}')
              if wq != rq and (wq or rq): w.append('prerequisite quest source disagreement; Wiki set retained')

              combined=' '.join([name,start,*items,*req,*prereq,*rewards]+[
                  (x.get('title','')+' '+x.get('text','')) if isinstance(x,dict) else str(x) for x in steps
              ])
              if BAD.search(combined): e.append('placeholder/vague filler detected')

              for i,st in enumerate(steps,1):
                  text=(st.get('text','') if isinstance(st,dict) else str(st)).strip()
                  if len(text)<12: w.append(f'step {i} unusually short')
                  if vague.fullmatch(text): e.append(f'step {i} is vague: {text}')

              for pq in prereq:
                  if pq not in names: e.append(f'prerequisite not in quest database: {pq}')

              # Item quantities: warn on suspicious bare generic items, but do not invent a number
              # when the authoritative source genuinely treats quantity as flexible/optional.
              for it in items:
                  t=str(it).strip()
                  if not t: e.append('blank item requirement')
                  if re.search(r'\b(?:coins?|logs?|bones?|food|runes?)\b',t,re.I) and not re.search(r'\d|any|some|optional|recommended|enough',t,re.I):
                      w.append('quantity may need manual/source review: '+t)

              # Reward-colour metadata must agree with reward text.
              reward_text=' '.join(rewards).lower()
              defxp=bool(re.search(r'\bdefen[cs]e\b.{0,45}\b(?:xp|experience)\b|\b(?:xp|experience)\b.{0,45}\bdefen[cs]e\b',reward_text,re.I))
              prayxp=bool(re.search(r'\bprayer\b.{0,45}\b(?:xp|experience)\b|\b(?:xp|experience)\b.{0,45}\bprayer\b',reward_text,re.I))
              if bool(q.get('defenceReward'))!=defxp: w.append('Defence colour metadata differs from reward text scan')
              if bool(q.get('prayerReward'))!=prayxp: w.append('Prayer colour metadata differs from reward text scan')

              rows.append({'quest':name,'errors':e,'warnings':w,'steps':len(steps),'items':len(items),
                           'skills':skills,'prerequisites':prereq,'start':start})
              errors.extend(f'{name}: {x}' for x in e)
              warnings.extend(f'{name}: {x}' for x in w)

          # Quest Cape route coverage and order checks.
          route_quests=[x.get('questName') for x in route if x.get('type')=='quest']
          missing_route=[n for n in names if n not in route_quests]
          duplicate_route=sorted({n for n in route_quests if route_quests.count(n)>1})
          if missing_route: warnings.append('Quest Cape route missing quests: '+', '.join(sorted(missing_route)))
          if duplicate_route: warnings.append('Quest Cape route duplicate quest entries: '+', '.join(duplicate_route))

          report=Path('questmate-complete/full-quest-audit.txt')
          lines=[
              'QUESTMATE v66 FULL QUEST-BY-QUEST AUDIT',
              f'Quest records: {len(qs)}',
              f'Hard completeness errors: {len(errors)}',
              f'Review warnings: {len(warnings)}',
              f'Quest Cape route quest rows: {len(route_quests)}',
              ''
          ]
          for row in rows:
              lines.append('=== '+row['quest']+' ===')
              lines.append(f"Steps: {row['steps']} | Items: {row['items']} | Skills: {row['skills']} | Prerequisites: {row['prerequisites']}")
              lines.append('Start: '+row['start'])
              for x in row['errors']: lines.append('ERROR: '+x)
              for x in row['warnings']: lines.append('WARNING: '+x)
          if missing_route: lines.append('\nROUTE MISSING: '+', '.join(sorted(missing_route)))
          if duplicate_route: lines.append('ROUTE DUPLICATES: '+', '.join(duplicate_route))
          report.write_text('\n'.join(lines),encoding='utf-8')

          print('\n'.join(lines[:8]))
          if errors:
              print('First hard errors:')
              print('\n'.join(errors[:80]))
              raise SystemExit('Full quest audit found hard completeness errors; refusing to build an inaccurate APK.')
          print('FULL QUEST AUDIT: PASS (warnings remain available in audit artifact)')
          PY

      - name: Validate Quest Cape route uses the same verified quest requirements
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,re
          q=json.load(open('questmate-complete/app/src/main/assets/quests.json',encoding='utf-8'))
          route=json.load(open('questmate-complete/app/src/main/assets/cape_route.json',encoding='utf-8'))
          by={x['name']:x for x in q}
          route_quests=[x.get('questName') for x in route if x.get('type')=='quest']
          pos={name:i for i,name in enumerate(route_quests)}
          errors=[]; warnings=[]

          for name,quest in by.items():
              if name not in pos:
                  errors.append(f'{name}: missing from Quest Cape route')
                  continue
              # Every prerequisite should normally occur before the dependent quest.
              for pre in quest.get('questRequirements',[]):
                  if pre not in pos:
                      errors.append(f'{name}: prerequisite {pre} is missing from route')
                  elif pos[pre] >= pos[name]:
                      warnings.append(f'{name}: prerequisite {pre} is not earlier in route order')

          # Training rows must mention a real OSRS skill and a target level.
          skills={'Attack','Strength','Defence','Ranged','Prayer','Magic','Runecraft','Construction',
                  'Hitpoints','Agility','Herblore','Thieving','Crafting','Fletching','Slayer','Hunter',
                  'Mining','Smithing','Fishing','Cooking','Firemaking','Woodcutting','Farming','Sailing'}
          training=[x for x in route if x.get('type')=='training']
          for row in training:
              txt=(row.get('title','')+' '+row.get('detail',''))
              if 'SKILL TRAINING BEFORE' in row.get('title',''):
                  if not any(re.search(r'\b'+re.escape(sk)+r'\b',txt,re.I) for sk in skills):
                      errors.append('training row names no recognised skill: '+row.get('title',''))
                  if not re.search(r'\b(?:required|train to|→)\s*\d{1,2}\b|\blevel\s+\d{1,2}\b',txt,re.I):
                      warnings.append('training row has no obvious target level: '+row.get('title',''))

          Path='questmate-complete/quest-cape-semantic-audit.txt'
          open(Path,'w',encoding='utf-8').write(
              f'Quest rows: {len(route_quests)}\nTraining rows: {len(training)}\nErrors: {len(errors)}\nWarnings: {len(warnings)}\n\n'
              +'\n'.join('ERROR: '+x for x in errors)
              +'\n'+'\n'.join('WARNING: '+x for x in warnings)
          )
          print(f'Quest Cape semantic consistency: quest rows={len(route_quests)}, training rows={len(training)}, errors={len(errors)}, warnings={len(warnings)}')
          if errors:
              print('\n'.join('ERROR: '+x for x in errors[:50]))
              raise SystemExit('Quest Cape route is inconsistent with the verified quest database')
          PY

