            bad=sum(1 for x in steps if BAD.search(clean(x.get('text',''))))
            tiny=sum(1 for x in steps if terse(clean(x.get('text',''))))
            return len(steps)*35 + words*2 + chars//20 + actions*12 - bad*5000 - tiny*4000

          def candidate_titles(name):
            base=TITLE_ALIAS.get(name.lower(),name)
            vals=[base,name,base.replace(' – ',' - '),base.replace(' - ',' – ')]
            vals += search_title(base)
            out=[]; seen=set()
            for x in vals:
              x=clean(x)
              if not x or '/Quick guide' in x: continue
              k=x.lower()
              if k not in seen:
                seen.add(k); out.append(x)
            return out[:10]

          repaired=[]
          unresolved=[]
          for i,q in enumerate(data,1):
            name=q.get('name','')
            if name in CURATED_QUEST_DATA:
              v=CURATED_QUEST_DATA[name]
              q['membership']=v['membership'];q['requirements']=v['requirements']
              q['skillRequirements']=v['skillRequirements'];q['questRequirements']=v['questRequirements']
              q['items']=v['items'];q['start']=v['start'];q['rewards']=v['rewards']
              q['rewardSource']='v75 reviewed current OSRS Wiki metadata fallback';q['rewardsVerified']=True;q['rewardCount']=len(q['rewards'])
            existing=q.get('steps',[]) or []
            candidates=[('existing',existing)]

            # Recipe for Disaster is a compound parent quest. Its authoritative walkthrough
            # is the dedicated /Full guide containing all 10 parts; ordinary extract() only
            # selects one Walkthrough block and is therefore insufficient.
            if name=='Recipe for Disaster':
              rfd_full=parse_page('Recipe for Disaster/Full guide')
              if rfd_full:
                cand=extract_rfd(rfd_full)
                if cand:
                  candidates.append(('Recipe for Disaster /Full guide (cached)',cand))

            for title in candidate_titles(name):
              full=parse_page(title)
              quick=parse_page(title+'/Quick guide')
              if full: candidates.append((title+' full',extract(full)))
              if quick: candidates.append((title+' quick',extract(quick)))
              # Exact alias/search winner with a plausible full guide is enough; avoid
              # hammering the Wiki unnecessarily for every search hit.
              if max(score(c[1]) for c in candidates) >= 500 and any(len(c[1])>=5 for c in candidates):
                break
            source,best=max(candidates,key=lambda c:score(c[1]))
            existing_has_terse=any(terse(clean(x.get('text',''))) for x in existing) or bool(q.get('needsDetailRepair'))
            best_is_clean=best and not any(
              terse(clean(x.get('text',''))) or BAD.search(clean(x.get('text',''))) or META_LEAK.search(clean(x.get('text','')))
              for x in best
            )
            if score(best)>score(existing) or (existing_has_terse and source!='existing' and best_is_clean):
              q['steps']=best
              q['sourceNote']=f'Guide database v67: global full-guide repair selected {source}; terse fragments are replaced with concrete walkthrough instructions.'
              repaired.append((name,source,len(best),score(best)))
            q.pop('needsDetailRepair',None)
            def guide_state():
              final=q.get('steps',[]) or []
              texts=[clean(x.get('text','')) for x in final]
              words=sum(len(re.findall(r"[A-Za-z0-9']+",t)) for t in texts)
              bad=[t for t in texts if BAD.search(t) or REWARD_LIKE.search(t)]
              leaks=metadata_leaks(final)
              return final,texts,words,bad,leaks

            final,texts,word_total,bad,leaks=guide_state()
            incomplete=(len(final)<3 or word_total<45)
            contaminated=bool(leaks)
            if contaminated:
              print(
                f"METADATA CONTAMINATION DETECTED: {name}: "
                + " | ".join(f"{kind}: {text[:140]}" for kind,text in leaks[:5]),
                flush=True
              )
            if incomplete or bad or contaminated or (name=='Recipe for Disaster' and rfd_coverage(q.get('steps',[]))):
              rescue=[]
              pages=(['Recipe for Disaster/Full guide'] if name=='Recipe for Disaster' else [name+'/Quick guide',name])
              for page in pages:
                live=exact_mirror_fetch(page)
                if live:
                  cand=extract_rfd(live) if name=='Recipe for Disaster' else extract(live)
                  if cand:rescue.append((page,cand))
              if rescue:
                clean_rescue=[
                  x for x in rescue
                  if not metadata_leaks(x[1])
                  and not any(BAD.search(clean(st.get('text',''))) or REWARD_LIKE.search(clean(st.get('text',''))) for st in x[1])
                ]
                pool=clean_rescue or rescue
                rescue_source,rescue_steps=max(pool,key=lambda x:score(x[1]))
                if contaminated or score(rescue_steps)>score(q.get('steps',[])):
                  q['steps']=rescue_steps
                  q['sourceNote']=f'v75 exact authoritative rescue selected {rescue_source} after cached parsing was incomplete or contaminated.'
                  repaired.append((name,'exact rescue '+rescue_source,len(rescue_steps),score(rescue_steps)))
              final,texts,word_total,bad,leaks=guide_state()
              incomplete=(len(final)<3 or word_total<45)
              contaminated=bool(leaks)

            if name=='Recipe for Disaster':
              rfd_missing=rfd_coverage(q.get('steps',[]))
