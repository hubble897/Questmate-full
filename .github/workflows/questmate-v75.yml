            if (incomplete or bad or contaminated) and name in CURATED_GUIDES:
              q['steps']=CURATED_GUIDES[name]
              q['sourceNote']='v75 reviewed quest-specific guide used only after authoritative cached/exact parsing remained incomplete or contaminated.'
              repaired.append((name,'reviewed curated guide',len(q['steps']),score(q['steps'])))
              final,texts,word_total,bad,leaks=guide_state()
              incomplete=(len(final)<3 or word_total<45)
              contaminated=bool(leaks)

            if incomplete or bad or contaminated:
              unresolved.append(
                f'{name}: steps={len(final)}, words={word_total}, bad={bad[:3]}, '
                f'metadataLeaks={[x[0] for x in leaks[:5]]}, '
                f'rfdMissing={rfd_coverage(final) if name=="Recipe for Disaster" else []}'
              )
            else:
              tiny=[t for t in texts if terse(t)]
              if tiny and len(final)>=8 and word_total>=120:
                print(f'v75 accepted {name}: substantial guide contains concise concrete actions: {tiny[:5]}')
            if i%10==0:print(f'v75 repair audited {i}/{len(data)} quests; unresolved={len(unresolved)}',flush=True)
            time.sleep(0.01)

          final_leaks=[]
          for q in data:
            for kind,text in metadata_leaks(q.get('steps',[])):
              final_leaks.append(f"{q['name']}: {kind}: {text[:180]}")
          if final_leaks:
            Path('questmate-complete/v75-metadata-leaks.txt').write_text('\n'.join(final_leaks),encoding='utf-8')
            raise RuntimeError('v75 repair-stage metadata contamination remains: '+' | '.join(final_leaks[:40]))
          Path('questmate-complete/v75-metadata-leaks.txt').write_text(
            'No item/database metadata contamination remains in any walkthrough.\n',encoding='utf-8')

          if unresolved:
