              // Turns every canonical quest name appearing inside arbitrary text into an
              // in-app link to the detailed QuestMate walkthrough. Longer quest names are
              // processed first and occupied character ranges prevent overlapping links.
              private TextView questLinkedTv(String text, float sp, int color, boolean bold, boolean fromCapeRoute) {
                  TextView v=tv(text,sp,color,bold);
                  if(text==null || text.isEmpty() || quests.isEmpty()) return v;
                  SpannableString ss=new SpannableString(text);
                  boolean[] used=new boolean[text.length()];
                  List<Quest> ordered=new ArrayList<>(quests);
                  ordered.sort((a,b)->Integer.compare(b.name.length(),a.name.length()));
                  boolean linked=false;
                  for(Quest quest:ordered) {
                      if(quest.name==null || quest.name.trim().isEmpty()) continue;
                      Pattern p=Pattern.compile("(?i)(?<![A-Za-z0-9])"+Pattern.quote(quest.name)+"(?![A-Za-z0-9])");
                      Matcher m=p.matcher(text);
                      while(m.find()) {
                          boolean overlap=false;
                          for(int i=m.start();i<m.end();i++) if(used[i]) { overlap=true; break; }
                          if(overlap) continue;
                          for(int i=m.start();i<m.end();i++) used[i]=true;
                          final Quest target=quest;
                          ss.setSpan(new ClickableSpan(){
                              @Override public void onClick(View widget) {
                                  returnToCapeRoute=fromCapeRoute;
                                  showQuest(target);
                              }
                              @Override public void updateDrawState(TextPaint ds) {
                                  super.updateDrawState(ds);
                                  ds.setColor(target.prayerReward?PRAYER_YELLOW:(target.defenceReward?DEFENCE_BLUE:ACCENT));
                                  ds.setUnderlineText(true);
                                  ds.setTypeface(Typeface.DEFAULT_BOLD);
                              }
                          },m.start(),m.end(),Spanned.SPAN_EXCLUSIVE_EXCLUSIVE);
                          linked=true;
                      }
                  }
                  if(linked) {
                      v.setText(ss);
                      v.setMovementMethod(LinkMovementMethod.getInstance());
                      v.setHighlightColor(Color.TRANSPARENT);
                  }
                  return v;
              }
