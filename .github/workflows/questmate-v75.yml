              require(q.get('questRequirements',[])==[],"Cook's Assistant incorrectly has prerequisite quests")
              for x in ('egg','milk','flour'): require(x in items,f"Cook's Assistant item list missing {x}")
              for x in ('egg','milk','flour','grain','hopper','lever','cook'): require(x in steps,f"Cook's Assistant walkthrough missing {x}")
              require(('cow' in steps or 'dairy' in steps),"Cook's Assistant walkthrough does not explain milking a cow")

          q=by.get('Imp Catcher')
