      - name: Validate mirror-derived quest data and Imp Catcher
        shell: bash
        run: |
          python3 - <<'PY'
          import json,re
          p='questmate-complete/app/src/main/assets/quests.json'
          d=json.load(open(p,encoding='utf-8'))
          by={q['name']:q for q in d}
          q=by['Imp Catcher']
          assert q.get('skillRequirements',{})=={}, f"Imp Catcher skill requirements corrupted: {q.get('skillRequirements')}"
          assert q.get('questRequirements',[])==[], f"Imp Catcher prerequisite quests corrupted: {q.get('questRequirements')}"
          assert 'Wizard Mizgog' in q.get('start',''), f"Imp Catcher start is wrong: {q.get('start')}"
          items=' '.join(q.get('items',[])).lower()
          for bead in ('black bead','yellow bead','red bead','white bead'):
              assert bead in items, f"Imp Catcher missing {bead}"
          steps=' '.join(x.get('text','') for x in q.get('steps',[])).lower()
          assert 'wizard mizgog' in steps
          assert 'agility level 80' not in steps and 'prayer level 31' not in steps
          assert 'options — wear, drop' not in steps.lower()
          assert 'buy limit' not in steps.lower()

          # v75 regression: Fairytale II was the quest that exposed the transient exact-page
          # failure. Validate the actual current metadata rather than merely checking non-empty.
          fairy=by['Fairytale II - Cure a Queen']
          assert fairy.get('skillRequirements')=={'Thieving':40,'Farming':49,'Herblore':57}, f"Fairytale II skills wrong: {fairy.get('skillRequirements')}"
          assert fairy.get('questRequirements')==['Fairytale I - Growing Pains'], f"Fairytale II prerequisite wrong: {fairy.get('questRequirements')}"
          reward_blob=' | '.join(fairy.get('rewards',[])).lower()
          for expected in ('2 quest points','3,500 herblore experience','2,500 thieving experience','2,500 experience in any skill over level 30','fairy rings network','fairy enchantment shop'):
              assert expected in reward_blob, f'Fairytale II reward missing/incorrect: {expected}; got {fairy.get("rewards")}'
          assert not fairy.get('defenceReward',False), 'Fairytale II must not be blue: no Defence XP reward'
          assert not fairy.get('prayerReward',False), 'Fairytale II must not be yellow: no Prayer XP reward'
          assert len(fairy.get('steps',[]))>=3, 'Fairytale II walkthrough still missing after exact-source repair'
          print('v75 Fairytale II exact metadata regression test: PASS')

          # Whole-database contamination patterns from item pages must never become walkthrough steps.
          bad=re.compile(r'(?i)\b(?:buy limit|options\s*[—:-]\s*(?:wear|drop|use)|exchange limit|high alch|low alch)\b')
          contaminated=[]
          for quest in d:
              for st in quest.get('steps',[]):
                  if bad.search(st.get('text','')):
                      contaminated.append(quest['name']+': '+st.get('text','')[:100])
          assert not contaminated, 'Item-page text leaked into walkthroughs: '+repr(contaminated[:20])
          print('Mirror/source integrity test PASS; quests:',len(d))
          PY

      - name: Validate Recipe for Disaster is one complete main quest
        shell: bash
        run: |
          python3 - <<'PY'
          import json,re
          p='questmate-complete/app/src/main/assets/quests.json'
          data=json.load(open(p,encoding='utf-8'))
          def key(x): return re.sub(r'[^a-z0-9]','',str(x).lower())
          rfd=[q for q in data if key(q.get('name','')).startswith(key('Recipe for Disaster'))]
          assert len(rfd)==1, f'Expected exactly one Recipe for Disaster main quest, found {[q.get("name") for q in rfd]}'
          q=rfd[0]
          assert q['name']=='Recipe for Disaster'
          text=' '.join((x.get('section','')+' '+x.get('text','')) for x in q.get('steps',[])).lower()
          for term in ('another cook','mountain dwarf','goblin','pirate pete','lumbridge guide','evil dave','skrach','sir amik','awowogei','culinaromancer'):
              assert term in text, f'Recipe for Disaster guide missing section/coverage: {term}'
          assert len(q.get('steps',[]))>=35, f'RFD guide too short: {len(q.get("steps",[]))} steps'
          assert not any('recipe for disaster dwarf' == x.get('name','').lower() for x in data)
          print('Recipe for Disaster canonical/full-guide validation PASS:',len(q.get('steps',[])),'steps')
          PY

      - name: Validate exact main quest population
        shell: bash
        run: |
          python3 - <<'PY'
          import json,re,requests
          from bs4 import BeautifulSoup

          data=json.load(open('questmate-complete/app/src/main/assets/quests.json',encoding='utf-8'))
          names=[q['name'] for q in data]
          assert len(names)==len(set(names)), 'Duplicate quest names in generated database'
          assert not any('/' in n for n in names), 'Subquest/subpage title leaked into generated database'
          assert names.count('Recipe for Disaster')==1
          assert not any(n.startswith('Recipe for Disaster/') for n in names)

          # Independent current-count check against the Wiki summary mirror.
          r=requests.get('https://osrsindex.com/wiki/quests?site=osrs_wiki',timeout=(5,20))
          r.raise_for_status()
          txt=' '.join(BeautifulSoup(r.text,'lxml').stripped_strings)
          m=re.search(r'(?i)there are a total of\s+(\d+)\s+quests',txt)
          assert m, 'Could not read current OSRS quest total'
          declared=int(m.group(1))
          assert len(names)==declared, f'Generated quest database has {len(names)} quests but Wiki declares {declared}'

          print(f'Exact main quest population PASS: {len(names)} quests')
          PY

      - name: Validate Death Plateau and all repaired walkthroughs
        shell: bash
        run: |
          python3 - <<'PY'
          import json,re
          data=json.load(open('questmate-complete/app/src/main/assets/quests.json',encoding='utf-8'))
          by={q['name']:q for q in data};q=by['Death Plateau']
          assert q.get('skillRequirements',{})=={}, f'Death Plateau skill requirements incorrect: {q.get("skillRequirements")}'
          assert q.get('questRequirements',[])==[], f'Death Plateau prerequisite quests incorrect: {q.get("questRequirements")}'
          assert 'Denulth' in q.get('start',''), q.get('start')
          items=' | '.join(q.get('items',[])).lower()
          for x in ('60','10','bread','trout','iron bar','asgarnian ale'):assert x in items, f'Death Plateau items missing {x}'
          text=' '.join(x.get('text','') for x in q.get('steps',[])).lower()
          for x in ('denulth','eohric','harold','saba','tenzing','dunstan','spiked','bread','trout'):assert x in text, f'Death Plateau walkthrough missing {x}'
          rewards=' '.join(q.get('rewards',[])).lower()
