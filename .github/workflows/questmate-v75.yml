              private String normQuestName(String s) {
                  return s == null ? "" : s.toLowerCase(Locale.ROOT).replaceAll("[^a-z0-9]", "");
              }

              private boolean nameIn(String normalized, String... names) {
                  for (String n : names) if (normalized.equals(normQuestName(n))) return true;
                  return false;
              }

              private boolean explicitDefenceRewardQuest(String questName) {
                  String n = normQuestName(questName);
                  return nameIn(n,
                      "A Soul's Bane","In Search of the Myreque","In Aid of the Myreque","Nature Spirit","What Lies Below",
                      "The Fremennik Trials","Heroes' Quest","Between a Rock...","Olaf's Quest","Holy Grail","Dragon Slayer I",
                      "King's Ransom","Monkey Madness I","The Fremennik Isles","Legends' Quest","Dream Mentor");
              }

              private boolean explicitPrayerRewardQuest(String questName) {
                  String n = normQuestName(questName);
                  return nameIn(n,
                      "The Restless Ghost","Priest in Peril","Holy Grail","Recruitment Drive","Mountain Daughter","Ghosts Ahoy",
                      "Spirits of the Elid","Making History","Rag and Bone Man II","Rum Deal","The Great Brain Robbery","Swan Song",
                      "Zogre Flesh Eaters","Tai Bwo Wannai Trio","King's Ransom");
              }

              private boolean rewardTextMentions(List<String> rewards, String skill) {
                  StringBuilder all = new StringBuilder();
                  for (String r : rewards) all.append(' ').append(r == null ? "" : r.toLowerCase(Locale.ROOT));
                  String b = all.toString();
                  String sk = skill.toLowerCase(Locale.ROOT);
                  int pos = b.indexOf(sk);
                  while (pos >= 0) {
                      int from = Math.max(0, pos - 55), to = Math.min(b.length(), pos + sk.length() + 55);
                      String window = b.substring(from, to);
                      if (window.contains("experience") || window.contains(" xp") || window.matches(".*\\d[\\d,.]*\\s*" + java.util.regex.Pattern.quote(sk) + ".*")) return true;
                      pos = b.indexOf(sk, pos + sk.length());
                  }
                  return false;
              }

              private void recomputeRewardColours(Quest q) {
                  String n = normQuestName(q.name);
                  boolean defenceByReward = rewardTextMentions(q.rewards, "defence") || rewardTextMentions(q.rewards, "defense");
                  boolean prayerByReward = rewardTextMentions(q.rewards, "prayer");
                  boolean defenceByName = explicitDefenceRewardQuest(q.name);
                  boolean prayerByName = explicitPrayerRewardQuest(q.name);
                  q.defenceReward = q.defenceReward || defenceByReward || defenceByName;
                  q.prayerReward = q.prayerReward || prayerByReward || prayerByName;
              }

