          def apply_training_row(text):
              if not re.search(r'(?i)train|level|experience|\bxp\b',text): return
              for sk in skills:
                  vals=[]
                  for pat in [rf'(?i){re.escape(sk)}[^0-9]{{0,25}}(?:to|level)\s*(\d{{1,2}})',rf'(?i)(?:to|level)\s*(\d{{1,2}})\s+{re.escape(sk)}',rf'(?i)\b(\d{{1,2}})\s+{re.escape(sk)}\b']:
                      vals += [int(x) for x in re.findall(pat,text)]
                  if vals:set_level(sk,max(vals))

          def apply_fixed_xp(q):
              skill_alt='|'.join(map(re.escape,skills))
              for reward in q.get('rewards',[]):
                  text=str(reward)
                  if not re.search(r'(?i)experience|\bxp\b',text):continue
                  if re.search(r'(?i)choose|choice|any skill|lamp|book of knowledge|tome',text):continue
                  patt=r'([0-9][0-9,]*)\s+((?:(?:'+skill_alt+r')(?:\s*(?:,|and)\s*)?)+)\s+(?:experience|xp)'
                  for amount,blob in re.findall(patt,text,re.I):
                      amt=int(amount.replace(',',''))
                      for sk in skills:
                          if re.search(r'(?i)\b'+re.escape(sk)+r'\b',blob):xp[sk]=xp.get(sk,0)+amt
                  patt2=r'([0-9][0-9,]*)\s+(?:experience|xp)\s+(?:in|to)\s+('+skill_alt+r')'
                  for amount,sk in re.findall(patt2,text,re.I):
                      canon=next(x for x in skills if x.lower()==sk.lower()); xp[canon]=xp.get(canon,0)+int(amount.replace(',',''))

          completed=set(); new=[]; checkpoints=0; prereq_checks=0
          for row in route:
              if row.get('type')=='training':
                  apply_training_row((row.get('title','')+' '+row.get('detail','')).strip()); new.append(row); continue
              if row.get('type')=='quest' and row.get('questName') in by:
                  q=by[row['questName']]
                  missing=[x for x in q.get('questRequirements',[]) if x not in completed]
                  if missing:
                      new.append({'type':'training','title':'PREREQUISITE CHECK BEFORE '+q['name'],'detail':'Complete these prerequisite quests first: '+', '.join(missing)+'. If following the route from the beginning, they should already be earlier in the route. Do not start this quest until they are complete.'}); prereq_checks+=1
                  needs=[]
                  for sk,target in sorted(q.get('skillRequirements',{}).items()):
                      cur=level(sk)
                      if cur<int(target):needs.append((sk,cur,int(target)))
                  if needs:
                      details=[]
