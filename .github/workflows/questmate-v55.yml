                  if (!q.questRequirements.isEmpty()) { p.addView(tv("Prerequisite quests",18,TEXT,true)); addBullets(p,q.questRequirements); }
                  if (!q.requirements.isEmpty()) { p.addView(tv("Other / complete requirement notes",18,TEXT,true)); addBullets(p,q.requirements); }
                  if (q.skillRequirements.isEmpty() && q.questRequirements.isEmpty() && q.requirements.isEmpty()) p.addView(tv("No prerequisite skill or quest requirements.",17,MUTED,false));

                  p.addView(heading("3. Quest Starting Location"));
                  if (q.start!=null && !q.start.trim().isEmpty()) p.addView(questLinkedTv(q.start,18,TEXT,false,returnToCapeRoute));
                  else p.addView(tv("Starting information unavailable in the source data.",17,MUTED,false));

                  int walkthroughColor = ACCENT;
                  TextView walkthroughHeading=tv("4. Complete Step-by-Step Walkthrough",25,ACCENT,true); margin(walkthroughHeading,0,18,0,8); p.addView(walkthroughHeading);
                  String current=""; int n=1;
                  for (Step s:q.steps) {
                      if (s.section!=null && !s.section.isEmpty() && !s.section.equals(current)) {
                          current=s.section; TextView sec=questLinkedTv(current,20,walkthroughColor,true,returnToCapeRoute); margin(sec,0,12,0,2); p.addView(sec);
                      }
                      TextView step=questLinkedTv((n++)+". "+s.text,18,TEXT,false,returnToCapeRoute); margin(step,0,3,0,8); p.addView(step);
                  }
                  if (q.steps.isEmpty()) p.addView(tv("DATA INTEGRITY ERROR: this quest was not allowed to ship without a walkthrough. Please use the v31 artifact.",17,PRAYER_YELLOW,true));

                  if (!q.rewards.isEmpty()) { p.addView(heading("5. Quest Rewards")); addBullets(p,q.rewards); TextView rm=tv("Reward metadata: " + (q.rewardSource.isEmpty()?"verified build sources":q.rewardSource) + " • " + q.rewardCount + " reward entries",13,MUTED,false); p.addView(rm); }

