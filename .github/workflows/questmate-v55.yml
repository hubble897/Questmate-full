name: QuestMate v55 - FULL QUEST AUDIT

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Install guide builder dependencies
        run: python3 -m pip install --disable-pip-version-check requests beautifulsoup4 lxml

      - name: CREATE QM v50 NEW ROUTE + COLOURS APP
        shell: bash
        run: |
          set -euo pipefail
          echo "=================================================="
          echo "QUESTMATE V50 WORKFLOW IS RUNNING"
          echo "Stable Java path: com/questmate/app/MainActivity.java"
          echo "=================================================="

          rm -rf questmate-complete
          mkdir -p questmate-complete/app/src/main/java/com/questmate/app
          mkdir -p questmate-complete/app/src/main/assets
          mkdir -p questmate-complete/app/src/main/res/values

          cat > questmate-complete/settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = 'QuestMateComplete'
          include ':app'
          EOF

          cat > questmate-complete/build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > questmate-complete/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF

          cat > questmate-complete/app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.questmate.v55fullaudit'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.questmate.v55fullaudit'
                  minSdk 26
                  targetSdk 35
                  versionCode 55
                  versionName '55.0-full-quest-audit'
              }
          }
          EOF

          cat > questmate-complete/app/src/main/res/values/strings.xml <<'EOF'
          <resources>
              <string name="app_name">QM v55 - FULL QUEST AUDIT</string>
          </resources>
          EOF

          cat > questmate-complete/app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="AppTheme" parent="android:style/Theme.Material.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:windowLightStatusBar">false</item>
                  <item name="android:statusBarColor">#101418</item>
                  <item name="android:navigationBarColor">#101418</item>
                  <item name="android:windowBackground">#101418</item>
              </style>
          </resources>
          EOF

          cat > questmate-complete/app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:allowBackup="true"
                  android:label="QM v55 - FULL QUEST AUDIT"
                  android:theme="@style/AppTheme"
                  android:usesCleartextTraffic="false">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="portrait">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > /tmp/quests.json.gz.b64 <<'BASE64'
