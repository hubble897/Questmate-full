          assert not vague_short_left, f'Vague short walkthrough fragments remain after global repair: {vague_short_left[:12]}'
          lunar=next((q for q in d if q.get('name')=='Lunar Diplomacy'),None)
          assert lunar and len(lunar.get('steps',[]))>=20, 'Lunar Diplomacy guide unexpectedly missing/short'
          assert any("Leave Baba Yaga's house" in str(s.get('text','')) for s in lunar.get('steps',[])), "Lunar Diplomacy concise valid step missing"
          print("Lunar Diplomacy valid-short-step regression test: PASS")
          fairy=[q for q in d if re.sub(r'[^a-z0-9]','',q.get('name','').lower()) in ('fairytaleiicureaqueen','fairytale2cureaqueen')]
          assert fairy and len(fairy[0].get('steps',[]))>=3, 'Fairytale II - Cure a Queen walkthrough is missing'
          assert not any('no verified walkthrough' in s.get('text','').lower() for q in d for s in q.get('steps',[])), 'No-walkthrough placeholder leaked into database'
          assert all(q.get('rewards') for q in d), 'Every retained quest must expose a rewards section'
          bad_titles=[q.get('name','') for q in d if q.get('name','').lower().startswith('quests/') or q.get('name','').lower() in {'quests','experienced','grandmaster','intermediate','master','novice','special'}]
          assert not bad_titles, f'Non-quest category/index headings leaked into quest list: {bad_titles}'
