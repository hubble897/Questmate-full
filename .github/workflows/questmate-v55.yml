              private int dp(int v) { return Math.round(v * getResources().getDisplayMetrics().density); }

              // v45: determine colours ONLY from the actual reward strings shown in Quest Rewards.
              private String actualRewardText(Quest q) {
                  StringBuilder b=new StringBuilder();
                  if(q!=null && q.rewards!=null) for(String r:q.rewards) if(r!=null) b.append(r).append(" ");
                  return b.toString().toLowerCase(Locale.ROOT);
              }
              private boolean actualDefenceXpReward(Quest q) {
                  String r=actualRewardText(q);
                  return (r.contains("defence") || r.contains("defense")) &&
                         (r.contains(" xp") || r.contains("experience"));
              }
              private boolean actualPrayerXpReward(Quest q) {
                  String r=actualRewardText(q);
                  return r.contains("prayer") && (r.contains(" xp") || r.contains("experience"));
              }
              private int actualRewardColour(Quest q) {
                  // v47: primary source is the build-time scan of the actual Rewards section.
                  if(q!=null && "yellow".equalsIgnoreCase(q.titleColour)) return PRAYER_YELLOW;
                  if(q!=null && "blue".equalsIgnoreCase(q.titleColour)) return DEFENCE_BLUE;
                  // Runtime re-scan is a second safety net.
                  if(actualPrayerXpReward(q)) return PRAYER_YELLOW;
                  if(actualDefenceXpReward(q)) return DEFENCE_BLUE;
                  return TEXT;
              }
              private String actualRewardTag(Quest q) {
                  if(q!=null && "yellow".equalsIgnoreCase(q.titleColour)) return "   • PRAYER XP";
                  if(q!=null && "blue".equalsIgnoreCase(q.titleColour)) return "   • DEFENCE XP";
                  if(actualPrayerXpReward(q)) return "   • PRAYER XP";
                  if(actualDefenceXpReward(q)) return "   • DEFENCE XP";
                  return "";
              }
              private TextView tv(String text, float sp, int color, boolean bold) {
                  TextView v = new TextView(this);
                  v.setText(text); v.setTextSize(sp); v.setTextColor(color);
                  v.setPadding(0, dp(7), 0, dp(7));
                  if (bold) v.setTypeface(Typeface.DEFAULT, Typeface.BOLD);
                  v.setLineSpacing(0,1.08f);
                  return v;
              }

              // Turns every canonical quest name appearing inside arbitrary text into an
              // in-app link to the detailed QuestMate walkthrough. Longer quest names are
              // processed first and occupied character ranges prevent overlapping links.
              private TextView questLinkedTv(String text, float sp, int color, boolean bold, boolean fromCapeRoute) {
                  TextView v=tv(text,sp,color,bold);
                  if(text==null || text.isEmpty() || quests.isEmpty()) return v;
                  SpannableString ss=new SpannableString(text);
                  boolean[] used=new boolean[text.length()];
                  List<Quest> ordered=new ArrayList<>(quests);
                  ordered.sort((a,b)->Integer.compare(b.name.length(),a.name.length()));
                  boolean linked=false;
                  for(Quest quest:ordered) {
                      if(quest.name==null || quest.name.trim().isEmpty()) continue;
                      Pattern p=Pattern.compile("(?i)(?<![A-Za-z0-9])"+Pattern.quote(quest.name)+"(?![A-Za-z0-9])");
                      Matcher m=p.matcher(text);
                      while(m.find()) {
                          boolean overlap=false;
                          for(int i=m.start();i<m.end();i++) if(used[i]) { overlap=true; break; }
                          if(overlap) continue;
                          for(int i=m.start();i<m.end();i++) used[i]=true;
                          final Quest target=quest;
                          ss.setSpan(new ClickableSpan(){
                              @Override public void onClick(View widget) {
                                  returnToCapeRoute=fromCapeRoute;
                                  showQuest(target);
                              }
                              @Override public void updateDrawState(TextPaint ds) {
                                  super.updateDrawState(ds);
                                  ds.setColor(target.prayerReward?PRAYER_YELLOW:(target.defenceReward?DEFENCE_BLUE:ACCENT));
                                  ds.setUnderlineText(true);
                                  ds.setTypeface(Typeface.DEFAULT_BOLD);
                              }
                          },m.start(),m.end(),Spanned.SPAN_EXCLUSIVE_EXCLUSIVE);
                          linked=true;
                      }
                  }
                  if(linked) {
                      v.setText(ss);
                      v.setMovementMethod(LinkMovementMethod.getInstance());
                      v.setHighlightColor(Color.TRANSPARENT);
                  }
                  return v;
              }
              private void margin(View v, int l, int t, int r, int b) {
                  LinearLayout.LayoutParams p = new LinearLayout.LayoutParams(-1,-2);
                  p.setMargins(dp(l),dp(t),dp(r),dp(b)); v.setLayoutParams(p);
              }
