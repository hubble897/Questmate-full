               'Firemaking':[(50,'burn the best logs practical for your level'),(99,'Wintertodt or suitable logs')],
               'Woodcutting':[(30,'normal then oak trees'),(60,'willow trees'),(70,'teak/maple trees'),(99,'best unlocked tree method')],
