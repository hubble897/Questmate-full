              private String normQuestName(String s) {
                  return s == null ? "" : s.toLowerCase(Locale.ROOT).replaceAll("[^a-z0-9]", "");
              }

              private boolean nameIn(String normalized, String... names) {
                  for (String n : names) if (normalized.equals(normQuestName(n))) return true;
                  return false;
              }

              private boolean explicitDefenceRewardQuest(String questName) {
                  String n = normQuestName(questName);
                  return nameIn(n,
                      "A Soul's Bane","In Search of the Myreque","In Aid of the Myreque","Nature Spirit","What Lies Below",
                      "The Fremennik Trials","Heroes' Quest","Between a Rock...","Olaf's Quest","Holy Grail","Dragon Slayer I",
                      "King's Ransom","Monkey Madness I","The Fremennik Isles","Legends' Quest","Dream Mentor");
              }

              private boolean explicitPrayerRewardQuest(String questName) {
                  String n = normQuestName(questName);
                  return nameIn(n,
                      "The Restless Ghost","Priest in Peril","Holy Grail","Recruitment Drive","Mountain Daughter","Ghosts Ahoy",
                      "Spirits of the Elid","Making History","Rag and Bone Man II","Rum Deal","The Great Brain Robbery","Swan Song",
                      "Zogre Flesh Eaters","Tai Bwo Wannai Trio","King's Ransom");
              }

              private boolean rewardTextMentions(List<String> rewards, String skill) {
                  StringBuilder all = new StringBuilder();
                  for (String r : rewards) all.append(' ').append(r == null ? "" : r.toLowerCase(Locale.ROOT));
                  String b = all.toString();
                  String sk = skill.toLowerCase(Locale.ROOT);
                  int pos = b.indexOf(sk);
                  while (pos >= 0) {
                      int from = Math.max(0, pos - 55), to = Math.min(b.length(), pos + sk.length() + 55);
                      String window = b.substring(from, to);
                      if (window.contains("experience") || window.contains(" xp") || window.matches(".*\\d[\\d,.]*\\s*" + java.util.regex.Pattern.quote(sk) + ".*")) return true;
                      pos = b.indexOf(sk, pos + sk.length());
                  }
                  return false;
              }

              private void recomputeRewardColours(Quest q) {
                  String n = normQuestName(q.name);
                  boolean defenceByReward = rewardTextMentions(q.rewards, "defence") || rewardTextMentions(q.rewards, "defense");
                  boolean prayerByReward = rewardTextMentions(q.rewards, "prayer");
                  boolean defenceByName = explicitDefenceRewardQuest(q.name);
                  boolean prayerByName = explicitPrayerRewardQuest(q.name);
                  q.defenceReward = q.defenceReward || defenceByReward || defenceByName;
                  q.prayerReward = q.prayerReward || prayerByReward || prayerByName;
              }

              private void loadQuests() {
                  try {
                      BufferedReader br=new BufferedReader(new InputStreamReader(getAssets().open("quests.json")));
                      StringBuilder sb=new StringBuilder(); String line; while((line=br.readLine())!=null) sb.append(line); br.close();
                      JSONArray a=new JSONArray(sb.toString());
                      for(int i=0;i<a.length();i++) {
                          JSONObject o=a.getJSONObject(i); Quest q=new Quest();
                          q.name=o.optString("name","Quest"); q.start=o.optString("start",""); q.sourceNote=o.optString("sourceNote","");
                          q.defenceReward=o.optBoolean("defenceReward",false);
                          q.prayerReward=o.optBoolean("prayerReward",false);
                          q.titleColour=o.optString("titleColour","default");
                          JSONArray items=o.optJSONArray("items"); if(items!=null) for(int j=0;j<items.length();j++) q.items.add(items.optString(j));
                          JSONArray req=o.optJSONArray("requirements"); if(req!=null) for(int j=0;j<req.length();j++) q.requirements.add(req.optString(j));
                          JSONObject sr=o.optJSONObject("skillRequirements"); if(sr!=null){ java.util.Iterator<String> it=sr.keys(); while(it.hasNext()){String k=it.next(); q.skillRequirements.add(k+" level "+sr.optInt(k));}}
                          JSONArray qr=o.optJSONArray("questRequirements"); if(qr!=null) for(int j=0;j<qr.length();j++) q.questRequirements.add(qr.optString(j));
                          q.membership=o.optString("membership","P2P");
                          JSONArray places=o.optJSONArray("places"); if(places!=null) for(int j=0;j<places.length();j++) q.places.add(places.optString(j));
                          JSONArray rewards=o.optJSONArray("rewards"); if(rewards!=null) for(int j=0;j<rewards.length();j++) q.rewards.add(rewards.optString(j));
                          q.rewardSource=o.optString("rewardSource",""); q.rewardsVerified=o.optBoolean("rewardsVerified",false); q.rewardCount=o.optInt("rewardCount",q.rewards.size());
                          // Recompute colour flags inside the installed app from the reward text itself.
                          // This makes title colours independent of build-time metadata surviving JSON generation.
                          recomputeRewardColours(q);
                          JSONArray steps=o.optJSONArray("steps"); if(steps!=null) for(int j=0;j<steps.length();j++) {
                              Object raw=steps.get(j);
                              if(raw instanceof JSONObject) { JSONObject so=(JSONObject)raw; q.steps.add(new Step(so.optString("section","Walkthrough"),so.optString("text",""))); }
                              else q.steps.add(new Step("Walkthrough",String.valueOf(raw)));
                          }
                          quests.add(q);
                      }
                  } catch(Exception e) {
                      Quest q=new Quest(); q.name="Quest database error"; q.start=e.toString(); quests.add(q);
                  }
              }

              @Override public void onBackPressed() { if(returnToCapeRoute){ returnToCapeRoute=false; showCapeRoute(); } else showList(); }
          }
