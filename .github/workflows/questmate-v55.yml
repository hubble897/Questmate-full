          }

          def clean(v):
            v=html.unescape(str(v or '')).replace('\xa0',' ')
            v=re.sub(r'\[edit(?: \| edit source)?\]','',v,flags=re.I)
            v=re.sub(r'\s*Show on map\s*',' ',v,flags=re.I)
            return SPACE.sub(' ',v).strip(' \t\r\n•-–—')

          def parse_page(title):
            try:
              r=S.get('https://oldschool.runescape.wiki/api.php',params={'action':'parse','page':title,'prop':'text','format':'json','formatversion':'2','redirects':'1','disablelimitreport':'1'},timeout=25)
              if r.ok:
                return r.json().get('parse',{}).get('text','') or ''
            except Exception as e:
              print('parse failed',title,repr(e))
            return ''

          def search_title(name):
            try:
              r=S.get('https://oldschool.runescape.wiki/api.php',params={'action':'query','list':'search','srsearch':name,'srnamespace':'0','srlimit':'8','format':'json','formatversion':'2'},timeout=25)
              if r.ok:
                return [clean(x.get('title','')) for x in r.json().get('query',{}).get('search',[]) if clean(x.get('title',''))]
            except Exception as e:
              print('search failed',name,repr(e))
            return []

          def direct_li_text(li):
            clone=BeautifulSoup(str(li),'html.parser').find('li')
            if clone is None: return clean(li.get_text(' ',strip=True))
            for nested in clone.find_all(['ul','ol']): nested.decompose()
            return clean(clone.get_text(' ',strip=True))

          def normalize_section(t):
            t=clean(t)
            return t if t else 'Walkthrough'

          def extract(markup):
            if not markup: return []
            soup=BeautifulSoup(markup,'html.parser')
            heads=soup.find_all(['h2','h3','h4'])
            root=None
            for h in heads:
              lab=clean(h.get_text(' ',strip=True)).lower()
              if lab=='walkthrough' or lab.startswith('walkthrough '): root=h; break
            # Quick-guide pages sometimes do not expose an exact Walkthrough h2. In that
            # case collect instructional content from the article body, but still stop at
            # rewards/references/etc. This is the global fallback that prevents empty guides.
            start=root if root is not None else soup.find(class_='mw-parser-output') or soup
            nodes=start.find_all_next() if isinstance(start,Tag) else soup.descendants
            section='Walkthrough'; out=[]; seen=set(); started=(root is None)
            stop=('rewards','reward','required for completing','changes','references','transcript','navigation','music unlocked','music','trivia','credits')
            skip=('requirements','recommended','items required','item requirements','start point','official difficulty','length','quest series','enemies to defeat')
            for node in nodes:
              if not isinstance(node,Tag): continue
              if root is not None and node is root:
                started=True; continue
              if not started: continue
              if node.name in ('h2','h3','h4'):
                lab=clean(node.get_text(' ',strip=True))
                low=lab.lower()
                if node.name=='h2' and any(low.startswith(x) for x in stop): break
                if low and not any(low.startswith(x) for x in skip): section=lab
                continue
              txt=''
              if node.name=='li': txt=direct_li_text(node)
              elif node.name=='p':
                t=clean(node.get_text(' ',strip=True))
                if t and (ACTION.search(t) or len(t)>=55): txt=t
              elif node.name=='tr':
                cells=node.find_all(['th','td'],recursive=False)
                vals=[clean(c.get_text(' ',strip=True)) for c in cells]
                vals=[x for x in vals if x]
                t=' — '.join(vals)
                if len(vals)>=2 and ACTION.search(t): txt=t
              txt=clean(txt)
              if not txt or len(txt)<8 or BAD.search(txt) or REWARD_LIKE.search(txt): continue
              # Do not keep tiny heading-like actions as standalone steps. They are only
              # useful if paired with the detailed sentence that follows.
              if terse(txt): continue
              key=txt.lower()
              if key in seen: continue
              seen.add(key); out.append({'section':normalize_section(section),'text':txt})
            return out

          def score(steps):
            if not steps: return -10**9
            words=sum(len(re.findall(r"[A-Za-z0-9']+",clean(x.get('text','')))) for x in steps)
            chars=sum(len(clean(x.get('text',''))) for x in steps)
            actions=sum(1 for x in steps if ACTION.search(clean(x.get('text',''))))
            bad=sum(1 for x in steps if BAD.search(clean(x.get('text',''))))
            tiny=sum(1 for x in steps if terse(clean(x.get('text',''))))
            return len(steps)*35 + words*2 + chars//20 + actions*12 - bad*5000 - tiny*4000

          def candidate_titles(name):
            base=TITLE_ALIAS.get(name.lower(),name)
            vals=[base,name,base.replace(' – ',' - '),base.replace(' - ',' – ')]
            vals += search_title(base)
            out=[]; seen=set()
            for x in vals:
              x=clean(x)
              if not x or '/Quick guide' in x: continue
              k=x.lower()
              if k not in seen:
                seen.add(k); out.append(x)
            return out[:10]

          repaired=[]
          for i,q in enumerate(data,1):
            name=q.get('name','')
            existing=q.get('steps',[]) or []
            candidates=[('existing',existing)]
            for title in candidate_titles(name):
              full=parse_page(title)
              quick=parse_page(title+'/Quick guide')
              if full: candidates.append((title+' full',extract(full)))
              if quick: candidates.append((title+' quick',extract(quick)))
              # Exact alias/search winner with a plausible full guide is enough; avoid
              # hammering the Wiki unnecessarily for every search hit.
              if max(score(c[1]) for c in candidates) >= 500 and any(len(c[1])>=5 for c in candidates):
                break
            source,best=max(candidates,key=lambda c:score(c[1]))
            existing_has_terse=any(terse(clean(x.get('text',''))) for x in existing) or bool(q.get('needsDetailRepair'))
            best_is_clean=best and not any(terse(clean(x.get('text',''))) or BAD.search(clean(x.get('text',''))) for x in best)
            if score(best)>score(existing) or (existing_has_terse and source!='existing' and best_is_clean):
              q['steps']=best
              q['sourceNote']=f'Guide database v30: global full-guide repair selected {source}; terse fragments are replaced with concrete walkthrough instructions.'
              repaired.append((name,source,len(best),score(best)))
            q.pop('needsDetailRepair',None)
            # Absolute shipping gate: no quest can reach the APK with no guide, a tiny stub,
            # a placeholder, reward leakage, or an under-detailed micro-step.
            final=q.get('steps',[]) or []
            texts=[clean(x.get('text','')) for x in final]
            word_total=sum(len(re.findall(r"[A-Za-z0-9']+",t)) for t in texts)
            bad=[t for t in texts if BAD.search(t) or REWARD_LIKE.search(t)]
            tiny=[t for t in texts if terse(t)]
            # v50: concise, specific action steps are valid inside an otherwise detailed guide.
            # We still fail on missing/tiny guides, placeholders, or reward leakage.
            incomplete_guide = (len(final)<3 or word_total<45)
            if incomplete_guide or bad:
              raise RuntimeError(f'{name}: v50 could not produce a complete detailed walkthrough (steps={len(final)}, words={word_total}, bad={bad[:3]}). Build stopped; no incomplete APK will be uploaded.')
            if tiny and len(final)>=8 and word_total>=120:
              print(f'v50 accepted {name}: substantial guide contains valid concise action steps: {tiny[:5]}')
            if i%20==0: print(f'v30 repair audited {i}/{len(data)} quests')
            time.sleep(0.02)

          # Recompute reward-linked colouring after all guide repairs. The reward strings are
          # the primary source; fallback sets protect quests whose Wiki wording expresses XP
          # through a selectable reward or another non-standard phrase.
          defence_fallback={
            "A Soul's Bane","In Search of the Myreque","In Aid of the Myreque","Nature Spirit","What Lies Below",
            "The Fremennik Trials","Heroes' Quest","Between a Rock...","Olaf's Quest","Holy Grail","Dragon Slayer I",
            "King's Ransom","Monkey Madness I","The Fremennik Isles","Legends' Quest","Dream Mentor"
          }
          prayer_fallback={
            "The Restless Ghost","Priest in Peril","Holy Grail","Recruitment Drive","Mountain Daughter","Ghosts Ahoy",
            "Spirits of the Elid","Making History","Rag and Bone Man II","Rum Deal","The Great Brain Robbery","Swan Song",
            "Zogre Flesh Eaters","Tai Bwo Wannai Trio","King's Ransom"
          }
          for q in data:
            # v47 FINAL reward scan: scan the exact reward strings stored in the quest.
            rewards=[str(x).strip() for x in (q.get('rewards',[]) or []) if str(x).strip()]
            blob=' | '.join(rewards).lower()

            defence_from_rewards=bool(re.search(
              r'(?:defen[cs]e.{0,60}(?:experience|\bxp\b)|(?:experience|\bxp\b).{0,60}defen[cs]e|\d[\d,.]*\s*(?:defen[cs]e)(?:\s*(?:experience|xp))?)',
              blob,re.I))
            prayer_from_rewards=bool(re.search(
              r'(?:prayer.{0,60}(?:experience|\bxp\b)|(?:experience|\bxp\b).{0,60}prayer|\d[\d,.]*\s*prayer(?:\s*(?:experience|xp))?)',
              blob,re.I))

            q['defenceReward']=defence_from_rewards or q.get('name') in defence_fallback
            q['prayerReward']=prayer_from_rewards or q.get('name') in prayer_fallback

            # Prayer takes yellow priority when both are present.
            if q['prayerReward']:
              q['titleColour']='yellow'
            elif q['defenceReward']:
              q['titleColour']='blue'
            else:
              q['titleColour']='default'

            q['rewardHighlightMetadata']={
              'defenceXpReward':q['defenceReward'],
              'prayerXpReward':q['prayerReward'],
              'titleColour':q['titleColour'],
              'detectedFrom':'v50 direct scan of final Quest Rewards section'
            }

          DB.write_text(json.dumps(data,ensure_ascii=False,separators=(',',':')),encoding='utf-8')
          Path('questmate-complete/v30-guide-repair.txt').write_text('\n'.join(f'{a} | {b} | steps={c} | score={d}' for a,b,c,d in repaired) or 'All existing guides were already at least as detailed as the v27 repair candidates.',encoding='utf-8')
          print(f'v30: audited {len(data)} quests; upgraded {len(repaired)} walkthroughs; zero empty guides permitted.')
          PY
          python3 /tmp/repair_all_guides.py
          cat questmate-complete/v30-guide-repair.txt | head -80

      - name: Verify guide database has no wiki links or placeholder text
