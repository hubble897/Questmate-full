          assert all('rewardSource' in q and 'rewardsVerified' in q and 'rewardCount' in q for q in d), 'Reward metadata fields missing'
          assert all(len(q.get('steps',[]))>=3 for q in d), 'Every retained quest must have a full walkthrough'
          assert all(sum(len(re.findall(r"[A-Za-z0-9']+",s.get('text',''))) for s in q.get('steps',[]))>=45 for q in d), 'Every quest must contain substantial walkthrough text, not a tiny stub'
          # v50: reject genuinely vague short placeholders, not valid concise actions.
          vague_short_re=re.compile(r'(?i)^\s*(?:do (?:it|this|that|step)|continue(?: the quest)?|complete (?:it|this|that|the step)|go there|talk to (?:him|her|them|the npc)|find (?:it|them|the item|the npc)|use (?:it|the item)|return there)\.?\s*$')
          vague_short_left=[]
          for q in d:
              for st in q.get('steps',[]):
