              private static final int TEXT = Color.rgb(238,240,243);
              private static final int MUTED = Color.rgb(184,190,199);
              private static final int ACCENT = Color.rgb(242,184,68);
              private static final int DEFENCE_BLUE = Color.rgb(80,170,255);
              private static final int PRAYER_YELLOW = Color.rgb(255,215,70);
              private final List<Quest> quests = new ArrayList<>();
              private final List<RouteStep> capeRoute = new ArrayList<>();
              private LinearLayout root;
              private boolean returnToCapeRoute = false;

              static class Step {
                  String section, text;
                  Step(String section, String text) { this.section=section; this.text=text; }
              }
              static class RouteStep {
                  String type, title, detail, questName;
              }
              static class Quest {
                  String name, start, sourceNote;
                  boolean defenceReward = false;
                  boolean prayerReward = false;
                  String titleColour = "default";
                  List<String> items = new ArrayList<>();
                  List<String> requirements = new ArrayList<>();
                  List<String> skillRequirements = new ArrayList<>();
                  List<String> questRequirements = new ArrayList<>();
                  String membership = "P2P";
                  List<String> places = new ArrayList<>();
