          cat > /tmp/enrich_quests.py <<'PYEOF'
          import json, re, time, html, csv
          from difflib import SequenceMatcher
          from pathlib import Path
          import requests
          from bs4 import BeautifulSoup, Tag

          SRC = Path('questmate-complete/app/src/main/assets/quests_seed.json')
          OUT = Path('questmate-complete/app/src/main/assets/quests.json')
          REPORT = Path('questmate-complete/guide-build-report.txt')
          AUDIT = Path('questmate-complete/guide-audit.csv')
          QH_ROOT = Path('/tmp/quest-helper/src/main/java/com/questhelper/helpers/quests')

          session = requests.Session()
          session.headers.update({
              'User-Agent': 'QuestMateCompleteGuideBuilder/10.0 (GitHub Actions; non-commercial guide compilation)',
              'Accept-Language': 'en-AU,en;q=0.9'
          })

          BAD = re.compile(r'(?i)not yet implemented|unknown|relevant npc|relevant location|placeholder|wiki reference|https?://|broken step state|\bdo step\b|\bcomplete this step\b|\bfollow the step\b|\bcontinue the quest\b|\bfinish this section\b')
          SUBGUIDE = re.compile(r"(?i)^\s*(?:do|complete|follow|perform|finish|continue(?: with)?|work through)\s+(?:the\s+)?(.+?)\s+(?:steps?|section|part|route|sub-?guide)\s*[.!]?\s*$")
          VAGUE = re.compile(r"(?i)^\s*(?:solve|complete|finish|do|perform|follow|continue|defeat)\s+(?:the\s+)?(?:[a-z0-9' -]+\s+)?(?:puzzle|section|part|route|fight|boss|trial|challenge|steps?|sub-?guide)\s*[.!]?\s*$")
          GENERIC = re.compile(r'(?i)^\s*(?:do|complete|perform|finish|continue)\s+(?:the\s+)?(?:next\s+)?step\s*\.?\s*$|^\s*solve\s+(?:the\s+)?puzzle\s*\.?\s*$')
          TERSE_ACTION = re.compile(r"(?i)^\s*(?:find(?:ing)?|locate|return|go|travel|head|talk|speak|meet|bring|get|obtain|collect|enter|leave|defeat|kill|fight|solve|complete|finish|use|take|make|craft|smith|mine|search|inspect|read|climb|cross|board|open|unlock)\b")
          # Reward/unlock metadata sometimes leaks into helper-derived step arrays. These are
          # not quest instructions and must never be treated as walkthrough actions.
          REWARD_LIKE_STEP = re.compile(r"(?i)^\s*(?:use of|access to|ability to|permission to|unlock(?:s|ed)?\b|reward(?:s)?\b|quest points?\b|(?:[0-9][0-9,]*)\s+(?:experience|xp)\b)")
          SPACE = re.compile(r'\s+')

          def is_terse_fragment(text):
              """Catch heading-like or placeholder-like micro steps such as
              'Find the portrait', 'Finding an Imcando', or 'Return the sword'.
              Real detailed instructions normally contain more than four words or
              include concrete route/dialogue/item information."""
              t=clean(text)
              if not t or REWARD_LIKE_STEP.search(t) or not TERSE_ACTION.search(t):
                  return False
              words=re.findall(r"[A-Za-z0-9']+", t)
              return len(words) <= 4

          def content_words(text):
              stop={'the','a','an','to','of','and','or','with','from','in','on','at','for','then','your','you','this','that','it','back'}
              out=[]
              for w in re.findall(r"[A-Za-z0-9']+", clean(text).lower()):
                  if w in stop: continue
                  # Tiny stemming is enough to match finding/find and returning/return.
                  if w.endswith('ing') and len(w)>5: w=w[:-3]
                  elif w.endswith('ed') and len(w)>4: w=w[:-2]
                  elif w.endswith('s') and len(w)>4: w=w[:-1]
                  out.append(w)
              return set(out)
          ACTION = re.compile(r'(?i)\b(talk|speak|go|travel|walk|run|enter|leave|climb|use|take|pick|collect|give|return|kill|fight|search|open|close|pull|push|operate|equip|wear|buy|bring|head|follow|cross|board|teleport|inspect|read|mine|cut|light|cook|make|place|unlock|drink|cast|pray|dig|craft|smith|choose|select|watch|wait)\b')

          NAME_FIX = {
              'Cooks Assistant': "Cook's Assistant",
              'Black Knight Fortress': "Black Knights' Fortress",
              'Black Knights Fortress': "Black Knights' Fortress",
              'A Porcine Of Interest': 'A Porcine of Interest',
              'A Night At The Theatre': 'A Night at the Theatre',
              'Demon Slayer': 'Demon Slayer',
              # OSRS Wiki uses the one-word 'Fairytale' spelling. Some RuneLite/seed
              # sources use 'Fairy Tale', which previously caused Cure a Queen to resolve
              # to a page with metadata but no usable walkthrough.
              'Fairy Tale I - Growing Pains': 'Fairytale I - Growing Pains',
              'Fairy Tale II - Cure a Queen': 'Fairytale II - Cure a Queen',
              'Fairy Tale I – Growing Pains': 'Fairytale I - Growing Pains',
              'Fairy Tale II – Cure a Queen': 'Fairytale II - Cure a Queen',
              'Fairytale 1 - Growing Pains': 'Fairytale I - Growing Pains',
              'Fairytale 2 - Cure a Queen': 'Fairytale II - Cure a Queen',
          }

          def clean(s):
              s = html.unescape(str(s or ''))
              s = s.replace('\xa0', ' ')
              s = re.sub(r'\[edit(?: \| edit source)?\]', '', s, flags=re.I)
              s = re.sub(r'Image:\s*', '', s, flags=re.I)
              s = re.sub(r'\s*Show on map\s*', '', s, flags=re.I)
              s = re.sub(r'\s*Quick Guide\s*', '', s, flags=re.I)
              s = SPACE.sub(' ', s).strip(' \t\r\n•-–—')
              return s

          def normalise_markup(value):
              if value is None: return ''
              if isinstance(value, bytes): return value.decode('utf-8', errors='replace')
              if isinstance(value, str): return value
              if isinstance(value, dict):
                  for key in ('*','html','text','body','content'):
                      if key in value:
                          v=normalise_markup(value.get(key))
                          if v: return v
                  return ''
              if isinstance(value, (list,tuple)):
                  return ''.join(normalise_markup(v) for v in value)
              return ''

          def safe_soup(markup):
              markup=normalise_markup(markup)
              if not markup: return None
              try: return BeautifulSoup(markup, 'html.parser')
              except Exception as exc:
                  print('Parser warning:', exc); return None

          def direct_li_text(li):
              clone=BeautifulSoup(str(li), 'html.parser').find('li')
              if clone is None: return clean(li.get_text(' ',strip=True))
              for nested in clone.find_all(['ul','ol']): nested.decompose()
              return clean(clone.get_text(' ',strip=True))

          def dedupe(values):
              out=[]; seen=set()
              for value in values:
                  t=clean(value); k=t.lower()
                  if t and k not in seen and not BAD.search(t):
                      seen.add(k); out.append(t)
              return out

          def wiki_parse(page):
              params={'action':'parse','page':page,'prop':'text','format':'json','formatversion':'2','redirects':'1','disablelimitreport':'1'}
              try:
                  r=session.get('https://oldschool.runescape.wiki/api.php',params=params,timeout=20)
                  if r.ok:
                      j=r.json(); parsed=j.get('parse',{}).get('text','')
                      parsed=normalise_markup(parsed)
                      if parsed: return parsed
              except Exception as exc:
                  print(f'Wiki parse failed for {page}: {exc}')
              return ''

          def resolve_wiki_title(title):
              fixed=NAME_FIX.get(title,title).strip()
              # First try exact page and quick-guide page.
              if wiki_parse(fixed + '/Quick guide') or wiki_parse(fixed):
                  return fixed
              # Resolve imperfect seed names with MediaWiki search.
              try:
                  params={'action':'query','list':'search','srsearch':fixed,'srnamespace':'0','srlimit':'5','format':'json','formatversion':'2'}
                  r=session.get('https://oldschool.runescape.wiki/api.php',params=params,timeout=20)
                  if r.ok:
                      for hit in r.json().get('query',{}).get('search',[]):
                          candidate=clean(hit.get('title',''))
                          if candidate and '/Quick guide' not in candidate:
                              if wiki_parse(candidate + '/Quick guide') or wiki_parse(candidate):
                                  return candidate
              except Exception as exc:
                  print(f'Wiki title search failed for {fixed}: {exc}')
              return fixed

          def fetch_wiki(title):
              canonical=resolve_wiki_title(title)
              quick=wiki_parse(canonical + '/Quick guide')
              full=wiki_parse(canonical)
              return canonical, quick, full

          def iter_after_heading(soup, target):
              for h in soup.find_all(['h2','h3']):
                  label=clean(h.get_text(' ',strip=True)).lower()
                  if label == target or label.startswith(target+' '):
                      level=int(h.name[1])
                      for node in h.find_all_next():
                          if isinstance(node,Tag) and node.name in ('h2','h3') and int(node.name[1]) <= level:
                              break
                          yield node
                      return

          def parse_walkthrough(markup):
              """
              Extract a complete, ordered walkthrough from OSRS Wiki markup.
              v12 deliberately keeps explanatory paragraphs, nested list steps,
              warnings and instruction-table rows instead of only top-level bullets.
              This fixes guides that previously collapsed into short/vague actions.
              """
              soup=safe_soup(markup)
              if soup is None: return []

              root=None
              for h in soup.find_all(['h1','h2','h3']):
                  label=clean(h.get_text(' ',strip=True)).lower()
                  if label == 'walkthrough' or label.startswith('walkthrough '):
                      root=h
                      break

              container=root.find_parent(class_='mw-parser-output') if root else soup.find(class_='mw-parser-output')
              if container is None: container=soup
              nodes=root.find_all_next() if root else container.descendants
              steps=[]; section='Walkthrough'; started=root is None
              seen=set()

              stop_heads=('rewards','reward','required for completing','changes','references',
                          'transcript','navigation','music unlocked','music','trivia','credits')

              def add_step(sec, value):
                  value=clean(value)
                  if not value or len(value)<8 or BAD.search(value) or REWARD_LIKE_STEP.search(value):
                      return
                  low=value.lower()
                  # Skip obvious page furniture and pure dialogue-choice number rows.
                  if low.startswith(('image ', 'map ', 'this page ', 'quest complete music')):
                      return
                  if re.fullmatch(r'(?:\d+\s*[|•]\s*)+\d*', value):
                      return
                  key=(clean(sec).lower(), low)
                  if key in seen:
                      return
                  seen.add(key)
                  steps.append({'section':clean(sec) or 'Walkthrough','text':value})

              for node in nodes:
                  if not isinstance(node,Tag): continue
                  if root and node is root:
                      started=True
                      continue
                  if not started: continue

                  if node.name=='h2':
                      t=clean(node.get_text(' ',strip=True))
                      if t.lower().startswith(stop_heads):
                          break
                      if t: section=t
                      continue

                  if node.name in ('h3','h4'):
                      t=clean(node.get_text(' ',strip=True))
                      if t: section=t
                      continue

                  if node.name=='li':
                      # Each nested bullet is retained as its own step. direct_li_text
                      # removes child lists from the parent, preventing duplication.
                      add_step(section, direct_li_text(node))
                      continue

                  if node.name=='p':
                      # Wiki guides often put crucial warnings, exact locations,
                      # puzzle details and completion instructions in paragraphs.
                      t=clean(node.get_text(' ',strip=True))
                      if t and (ACTION.search(t) or len(t)>=45):
                          add_step(section, t)
                      continue

                  if node.name=='tr':
                      cells=node.find_all(['th','td'],recursive=False)
                      if len(cells)>=2:
                          vals=[clean(c.get_text(' ',strip=True)) for c in cells]
                          vals=[v for v in vals if v]
                          # Keep instruction-table rows, but ignore metadata tables.
                          joined=' — '.join(vals)
                          if ACTION.search(joined) and len(joined)>=20:
                              add_step(section, joined)

              return steps

          def _norm_label(s):
              s=clean(s).lower()
              s=re.sub(r"['’]",'',s)
              s=re.sub(r'[^a-z0-9]+',' ',s)
              return SPACE.sub(' ',s).strip()

          def extract_named_section(markup, label):
              """Expand a named in-page quest subsection into real ordered actions.
              This is what turns lines such as 'Do Perseriya steps.' into the actual
              Perseriya route rather than leaving a sub-guide pointer in the app.
              """
              soup=safe_soup(markup)
              if soup is None: return []
              wanted=_norm_label(label)
              if not wanted: return []
              headings=soup.find_all(['h2','h3','h4','h5'])
              chosen=None
              for h in headings:
                  got=_norm_label(h.get_text(' ',strip=True))
                  if got==wanted:
                      chosen=h; break
              if chosen is None:
                  best=None; best_ratio=0.0
                  for h in headings:
                      got=_norm_label(h.get_text(' ',strip=True))
                      if wanted in got or got in wanted:
                          if min(len(got),len(wanted)) >= 4:
                              chosen=h; break
                      # Handle wording changes such as 'Find the portrait' vs
                      # 'Finding the portrait' without guessing unrelated sections.
                      ratio=SequenceMatcher(None,wanted,got).ratio() if got else 0.0
                      if ratio>best_ratio:
                          best_ratio=ratio; best=h
                  if chosen is None and best is not None and best_ratio>=0.72:
                      chosen=best
              if chosen is None: return []
              level=int(chosen.name[1]); section=clean(chosen.get_text(' ',strip=True)) or label
              out=[]; seen=set()
              def add(value, sec=section):
                  value=clean(value)
                  if not value or len(value)<8 or BAD.search(value) or REWARD_LIKE_STEP.search(value): return
                  if SUBGUIDE.match(value) or VAGUE.match(value): return
                  key=value.lower()
                  if key in seen: return
                  seen.add(key); out.append({'section':sec,'text':value})
              for node in chosen.find_all_next():
                  if not isinstance(node,Tag): continue
                  if node.name in ('h2','h3','h4','h5'):
                      node_level=int(node.name[1])
                      if node_level <= level: break
                      section=clean(node.get_text(' ',strip=True)) or section
                      continue
                  if node.name=='li': add(direct_li_text(node),section)
                  elif node.name=='p':
                      t=clean(node.get_text(' ',strip=True))
                      if t and (ACTION.search(t) or len(t)>=45): add(t,section)
                  elif node.name=='tr':
                      cells=node.find_all(['th','td'],recursive=False)
                      if len(cells)>=2:
                          vals=[clean(c.get_text(' ',strip=True)) for c in cells]
                          vals=[v for v in vals if v]
                          joined=' — '.join(vals)
                          if ACTION.search(joined) and len(joined)>=20: add(joined,section)
              return out

          def linked_page_for_label(markup, label):
              """Find a wiki page linked by the shortcut label, if the detail lives off-page."""
              soup=safe_soup(markup)
              if soup is None: return ''
              wanted=_norm_label(label)
              for a in soup.find_all('a',href=True):
                  txt=_norm_label(a.get_text(' ',strip=True))
                  if not txt: continue
                  if txt==wanted or wanted in txt or txt in wanted:
                      href=a.get('href','')
                      m=re.search(r'/w/([^#?]+)',href)
                      if m:
                          from urllib.parse import unquote
                          return unquote(m.group(1)).replace('_',' ')
              return ''

          def expand_subguide_shortcuts(steps, full_markup, quick_markup, quest_title):
              """Flatten every named sub-guide pointer into the main walkthrough.
              No 'Do X steps' entry is allowed to survive. Expansion first searches
              headings on the quest's full/quick guide, then follows a matching wiki link.
              """
              out=[]
              for st in steps or []:
                  txt=clean(st.get('text',''))
                  m=SUBGUIDE.match(txt)
                  if not m and VAGUE.match(txt):
                      # A vague instruction such as 'Solve the electricity puzzle' is
                      # replaced with the detailed instructions under its current section.
                      label=clean(st.get('section','')).rstrip(' .:;-')
                      expanded=[]
                      if label and label.lower() not in ('walkthrough','runelite quest helper','quest helper'):
                          for markup in (full_markup,quick_markup):
                              expanded=extract_named_section(markup,label)
                              expanded=[x for x in expanded if clean(x.get('text','')).lower()!=txt.lower()]
                              if expanded: break
                      if expanded:
                          out.extend(expanded); continue
                      out.append(st); continue
                  if not m and is_terse_fragment(txt):
                      # Short labels are often section headings leaked into the step list.
                      # Try to expand both the text itself and its section heading into the
                      # real Wiki instructions before allowing the fragment to survive.
                      expanded=[]
                      labels=[txt, clean(st.get('section',''))]
                      for label_try in labels:
                          if not label_try: continue
                          for markup in (full_markup,quick_markup):
                              expanded=extract_named_section(markup,label_try)
                              expanded=[x for x in expanded if clean(x.get('text','')).lower()!=txt.lower()]
                              if expanded: break
                          if expanded: break
                      if expanded:
                          out.extend(expanded); continue
                      out.append(st); continue
                  if not m:
                      out.append(st); continue
                  label=clean(m.group(1)).rstrip(' .:;-')
                  expanded=[]
                  for markup in (full_markup,quick_markup):
                      expanded=extract_named_section(markup,label)
                      if expanded: break
                  if not expanded:
                      target=''
                      for markup in (full_markup,quick_markup):
                          target=linked_page_for_label(markup,label)
                          if target: break
                      if target:
                          linked=wiki_parse(target)
                          expanded=parse_walkthrough(linked)
                          if not expanded:
                              expanded=extract_named_section(linked,label)
                  if not expanded:
                      raise RuntimeError(f'{quest_title}: unresolved sub-guide shortcut: {txt}')
                  out.extend(expanded)
              # A second pass catches a shortcut exposed by an expanded subsection.
              if any(SUBGUIDE.match(clean(x.get('text',''))) for x in out):
                  return expand_subguide_shortcuts(out,full_markup,quick_markup,quest_title)
              return out

          def remove_redundant_summary_shortcuts(steps):
              """Remove heading-like summary rows only when their information is already
              present in a longer concrete instruction. This catches trailing leftovers such
              as 'Finding an Imcando', 'Find the portrait', and 'Return the sword' globally,
              while preserving unique required actions."""
              steps=list(steps or [])
              concrete_by_section={}
              concrete=[]
              for st in steps:
                  sec=clean(st.get('section','')).casefold()
                  txt=clean(st.get('text',''))
                  if not txt:
                      continue
                  if not SUBGUIDE.match(txt) and not VAGUE.match(txt) and not BAD.search(txt) and not is_terse_fragment(txt):
                      concrete_by_section[sec]=concrete_by_section.get(sec,0)+1
                      concrete.append((txt,content_words(txt)))

              out=[]
              for st in steps:
                  sec=clean(st.get('section','')).casefold()
                  txt=clean(st.get('text',''))
                  if (SUBGUIDE.match(txt) or VAGUE.match(txt)) and concrete_by_section.get(sec,0)>0:
                      continue
                  if is_terse_fragment(txt):
                      keys=content_words(txt)
                      # Remove only when a longer detailed instruction demonstrably covers
                      # the same subject/action; otherwise leave it for the final audit so
                      # the build cannot silently hide a missing quest action.
                      covered=False
                      for other,other_keys in concrete:
                          if len(other) < 35: continue
                          overlap=keys & other_keys
                          if keys and (len(overlap)>=max(1,len(keys)-1) or (len(keys)<=2 and overlap)):
                              covered=True; break
                      if covered:
                          continue
                  out.append(st)
              return out

          def safe_expand_candidate(steps, full_markup, quick_markup, quest_title, label):
              """Expand one candidate and reject it only if unresolved shortcut text
              remains after safe redundant-summary cleanup."""
              try:
                  expanded=expand_subguide_shortcuts(steps,full_markup,quick_markup,quest_title)
                  expanded=strip_generic_steps(expanded)
                  expanded=remove_redundant_summary_shortcuts(expanded)
                  bad=[clean(x.get('text','')) for x in expanded
                       if SUBGUIDE.match(clean(x.get('text',''))) or VAGUE.match(clean(x.get('text','')))]
                  if bad:
                      raise RuntimeError('unresolved placeholder/sub-guide text: '+repr(bad[:5]))
                  return expanded, ''
              except Exception as exc:
                  return [], f'{label}: {exc}'

          def parse_rewards(markup):
              soup=safe_soup(markup)
              if soup is None: return []
              rewards=[]
              # OSRS Wiki uses both "Reward" and "Rewards" headings depending on the quest.
              for target_heading in ('rewards','reward'):
                  for node in iter_after_heading(soup,target_heading) or []:
                      if isinstance(node,Tag) and node.name=='li':
                          t=direct_li_text(node)
                          if t and len(t)>1: rewards.append(t)
                      elif isinstance(node,Tag) and node.name=='p' and not rewards:
                          t=clean(node.get_text(' ',strip=True))
                          if t: rewards.append(t)
                  if rewards:
                      return dedupe(rewards)
              # Infobox/table fallback.
              for tr in soup.find_all('tr'):
                  cells=tr.find_all(['th','td'],recursive=False)
                  if len(cells)>=2 and clean(cells[0].get_text(' ',strip=True)).lower().startswith(('reward','rewards')):
                      vals=[direct_li_text(li) for li in cells[1].find_all('li')]
                      if not vals:
                          vals=[clean(cells[1].get_text(' ',strip=True))]
                      return dedupe(vals)
              return []

          def parse_items(markup):
              soup=safe_soup(markup)
              if soup is None: return []
              for tr in soup.find_all('tr'):
                  cells=tr.find_all(['th','td'],recursive=False)
                  if len(cells)>=2 and clean(cells[0].get_text(' ',strip=True)).lower().startswith('items required'):
                      vals=[direct_li_text(li) for li in cells[1].find_all('li')]
                      if not vals: vals=[clean(cells[1].get_text(' ',strip=True))]
                      return dedupe(vals)
              return []

          def parse_start_info(markup):
              soup=safe_soup(markup)
              if soup is None: return ''
              for tr in soup.find_all('tr'):
                  cells=tr.find_all(['th','td'],recursive=False)
                  if len(cells)>=2:
                      h=clean(cells[0].get_text(' ',strip=True)).lower()
                      if h.startswith('start point') or h.startswith('start location'):
                          return clean(cells[1].get_text(' ',strip=True))
              return ''

          def parse_requirements(markup, canonical_titles):
              soup=safe_soup(markup)
              if soup is None: return [],{},[]
              bodies=[]
              for tr in soup.find_all('tr'):
                  cells=tr.find_all(['th','td'],recursive=False)
                  if len(cells)>=2:
                      h=clean(cells[0].get_text(' ',strip=True)).lower()
                      if h in ('requirements','requirement'):
                          bodies.append(cells[-1])
              if not bodies: return [],{},[]
              vals=[]; links=[]
              for body in bodies:
                  lis=body.find_all('li')
                  if lis:
                      vals.extend(clean(li.get_text(' ',strip=True)) for li in lis)
                  else:
                      t=clean(body.get_text(' ',strip=True))
                      if t: vals.append(t)
                  for a in body.find_all('a'):
                      label=clean(a.get('title','') or a.get_text(' ',strip=True))
                      if label: links.append(label)
              vals=dedupe([x for x in vals if x])
              joined=' • '.join(vals)
              skill_names=('Attack','Strength','Defence','Ranged','Prayer','Magic','Runecraft','Construction','Hitpoints','Agility','Herblore','Thieving','Crafting','Fletching','Slayer','Hunter','Mining','Smithing','Fishing','Cooking','Firemaking','Woodcutting','Farming','Sailing')
              # Accept both "53 Thieving" and "Thieving 53" forms.
              r1=re.compile(r'\b(\d{1,2})\s+('+'|'.join(map(re.escape,skill_names))+r')\b',re.I)
              r2=re.compile(r'\b('+'|'.join(map(re.escape,skill_names))+r')\s+(?:level\s+)?(\d{1,2})\b',re.I)
              skill_req={}
              for lvl,sk in r1.findall(joined):
                  sk=next(x for x in skill_names if x.lower()==sk.lower())
                  skill_req[sk]=max(skill_req.get(sk,0),int(lvl))
              for sk,lvl in r2.findall(joined):
                  sk=next(x for x in skill_names if x.lower()==sk.lower())
                  skill_req[sk]=max(skill_req.get(sk,0),int(lvl))
              cmap={title_key(x):x for x in canonical_titles}
              prereq=[]
              for label in links:
                  k=title_key(label)
                  if k in cmap: prereq.append(cmap[k])
              # Also detect canonical quest titles appearing as plain text.
              low=joined.lower()
              for ck,ct in cmap.items():
                  if ct.lower() in low: prereq.append(ct)
              return vals,skill_req,dedupe(prereq)


          F2P_QUESTS={
              title_key(x) for x in (
              "Below Ice Mountain","Black Knights' Fortress","Cook's Assistant","Demon Slayer",
              "Doric's Quest","Dragon Slayer I","Ernest the Chicken","Goblin Diplomacy","Imp Catcher",
              "Misthalin Mystery","Pirate's Treasure","Prince Ali Rescue","Romeo & Juliet",
              "Rune Mysteries","Sheep Shearer","Shield of Arrav","The Corsair Curse","The Ides of Milk",
              "The Knight's Sword","The Restless Ghost","Vampyre Slayer","Witch's Potion","X Marks the Spot")
          }

          def seed_index():
              raw=json.loads(SRC.read_text(encoding='utf-8'))
              out={}
              for q in raw:
                  raw_name=clean(q.get('name',''))
                  name=NAME_FIX.get(raw_name,raw_name)
                  for n in (raw_name,name):
                      k=title_key(n)
                      if k and k not in out: out[k]=q
              # Display-name aliases used by canonical_quest_titles().
              alias_pairs={
                  "Cook's Assistant":'Cooks Assistant',
                  "Black Knights' Fortress":'Black Knight Fortress',
                  'Dragon Slayer I':'Dragon Slayer',
                  'Desert Treasure I':'Desert Treasure',
                  'Desert Treasure II - The Fallen Empire':'Desert Treasure I I',
                  'Dragon Slayer II':'Dragon Slayer I I',
              }
              for display,seed_name in alias_pairs.items():
                  src=out.get(title_key(seed_name))
                  if src is not None:
                      out[title_key(display)]=src
              return out

          def is_complete_main_quest(q):
              # Membership is determined only by the canonical main-quest index. Guide
              # quality is validated separately so a real quest can never silently vanish.
              return True

          seeds=seed_index()
          titles=canonical_quest_titles()
          rebuilt=[]; audit=[]
          counts={'wiki':0,'runelite':0,'seed':0,'weak':0,'missing_rewards':0}

          for idx,title in enumerate(titles,1):
              q0=seeds.get(title_key(title),{})
              q=dict(q0)
              q['name']=title
              q.pop('wikiUrl',None); q.pop('source',None)
              canonical,quick,full=fetch_wiki(title)
              # Keep the exact official Quests/List title as the app heading. fetch_wiki is
              # used only for walkthrough content, never to create extra/non-quest entries.

              quick_steps=strip_generic_steps(parse_walkthrough(quick) if quick else [])
              full_steps=strip_generic_steps(parse_walkthrough(full) if full else [])
              runelite=strip_generic_steps(qh_steps(q['name']))
              seed=strip_generic_steps(good_seed_steps(q))

              # Expand each candidate independently. A broken sub-guide pointer in one
              # source must not abort all 189 quests; that candidate is rejected instead.
              candidate_errors=[]
              quick_steps,err=safe_expand_candidate(quick_steps,full,quick,q['name'],'OSRS Wiki quick guide')
              if err: candidate_errors.append(err)
              full_steps,err=safe_expand_candidate(full_steps,full,quick,q['name'],'OSRS Wiki full guide')
              if err: candidate_errors.append(err)
              runelite,err=safe_expand_candidate(runelite,full,quick,q['name'],'RuneLite Quest Helper')
              if err: candidate_errors.append(err)
              seed,err=safe_expand_candidate(seed,full,quick,q['name'],'embedded Quest Helper seed')
              if err: candidate_errors.append(err)

              choices=[
                  ('RuneLite Quest Helper', runelite),
                  ('OSRS Wiki quick guide', quick_steps),
                  ('OSRS Wiki full guide', full_steps),
                  ('embedded Quest Helper seed', seed),
              ]
              viable=[pair for pair in choices if pair[1] and detail_score(pair[1])>-100000]
              if not viable:
                  raise RuntimeError(
                      f"{q['name']}: no complete all-in-one walkthrough candidate remained after "
                      f"expansion and redundant-summary cleanup. Candidate failures: {' | '.join(candidate_errors)}"
                  )
              # Prefer the full OSRS Wiki walkthrough whenever it survived expansion.
              # RuneLite/quick-guide data remain fallbacks, but a short helper summary must
              # never beat a richer full quest page simply because it contains many headings.
              full_pair=next((p for p in viable if p[0]=='OSRS Wiki full guide'),None)
              if full_pair and len(full_pair[1])>=3 and detail_score(full_pair[1])>=45:
                  source,best=full_pair
              else:
                  source,best=max(viable,key=lambda pair:detail_score(pair[1]))
              q['steps']=strip_generic_steps(best)
              if source=='OSRS Wiki': counts['wiki']+=1
              elif source=='RuneLite Quest Helper': counts['runelite']+=1
              else: counts['seed']+=1

              items=parse_items(quick) or parse_items(full) or q.get('items',[])
              q['items']=dedupe(items)
              q['places']=dedupe(q.get('places',[]))
              req_all,skill_req,quest_req=parse_requirements(quick or full,titles)
              if not req_all:
                  req_all,skill_req,quest_req=parse_requirements(full,titles)
              q['requirements']=req_all
              q['skillRequirements']=skill_req
              q['questRequirements']=[x for x in quest_req if title_key(x)!=title_key(q['name'])]
              q['membership']='F2P' if title_key(q['name']) in F2P_QUESTS else 'P2P'
              parsed_start=parse_start_info(quick) or parse_start_info(full)
              if parsed_start: q['start']=parsed_start
              wiki_rewards=dedupe(parse_rewards(full)+parse_rewards(quick))
              runelite_rewards=qh_rewards(q['name'])
              seed_rewards=dedupe(q.get('rewards',[]))
              # OSRS Wiki is authoritative for the complete reward list; RuneLite and
              # embedded metadata supplement it instead of replacing it.
              rewards=dedupe(wiki_rewards + runelite_rewards + seed_rewards)
              q['rewards']=rewards
              sources=[]
              if wiki_rewards: sources.append('OSRS Wiki')
              if runelite_rewards: sources.append('RuneLite Quest Helper')
              if seed_rewards: sources.append('embedded metadata')
              q['rewardSource']=' + '.join(sources)
              q['rewardsVerified']=bool(wiki_rewards or runelite_rewards)
              q['rewardCount']=len(rewards)
              q['rewardMetadata']={
                  'authoritativeSource':'OSRS Wiki' if wiki_rewards else ('RuneLite Quest Helper' if runelite_rewards else 'embedded metadata'),
                  'sourceList':sources,
                  'wikiRewardCount':len(wiki_rewards),
                  'runeliteRewardCount':len(runelite_rewards),
                  'embeddedRewardCount':len(seed_rewards),
                  'mergedRewardCount':len(rewards),
              }

              if q['steps']:
                  existing=clean(q.get('start',''))
                  q['start']=existing if existing and not BAD.search(existing) else q['steps'][0]['text']
              else:
                  q['start']=''

              norm_name=re.sub(r'[^a-z0-9]','',q.get('name','').lower())
              if q['name'].lower().replace("'",'') == 'cooks assistant': q=patch_cooks(q)
              if norm_name == 'thecorsaircurse':
                  q=patch_corsair(q)
              if norm_name in ('blackknightfortress','blackknightsfortress'):
                  q=patch_black_knights(q)
              if norm_name == 'demonslayer':
                  q=patch_demon_slayer(q)
              if norm_name in ('deserttreasureiithefallenempire','deserttreasure2thefallenempire','deserttreasureii'):
                  q=patch_desert_treasure_ii(q,full_steps,quick_steps,runelite)
              q=patch_missing_core_guides(q)
              try:
                  q['steps']=strip_generic_steps(expand_subguide_shortcuts(q.get('steps',[]),full,quick,q['name']))
                  q['steps']=remove_redundant_summary_shortcuts(q['steps'])
              except Exception as exc:
                  raise RuntimeError(f"{q['name']}: final all-in-one expansion failed after choosing {source}: {exc}")
              # Hard-stop unresolved sub-guide/puzzle placeholders here. Short concrete actions
              # are NOT fatal at this stage: the global repair pass below must replace them
              # from the full Wiki walkthrough. This avoids aborting before repair can handle
              # legitimate but under-detailed lines such as "Bring Thurgo the portrait."
              if any(SUBGUIDE.match(clean(x.get('text',''))) or VAGUE.match(clean(x.get('text',''))) for x in q['steps']):
                  bad=[clean(x.get('text','')) for x in q['steps'] if SUBGUIDE.match(clean(x.get('text',''))) or VAGUE.match(clean(x.get('text','')))]
                  raise RuntimeError(f"{q['name']}: vague/sub-guide instruction survived initial expansion: {bad[:8]}")
              q['needsDetailRepair']=any(is_terse_fragment(clean(x.get('text',''))) for x in q['steps'])

              # Never invent a reward placeholder. Missing reward metadata is an audit
              # failure so the APK cannot claim incomplete rewards as real data.
              if not q.get('rewards'):
                  counts['missing_rewards']+=1

              q['defenceReward']=has_defence_reward(q)
              q['prayerReward']=has_prayer_reward(q)
              q['rewardHighlightMetadata']={
                  'defenceXpReward':q['defenceReward'],
                  'prayerXpReward':q['prayerReward'],
                  'detectedFrom':'merged reward metadata + normalized verified fallback'
              }

              score=quality(q['steps'])
              if score<45: counts['weak']+=1
              q['sourceNote']=f'Guide assembled from {source}; OSRS Wiki and RuneLite data are cross-checked where available. Quality score: {score}.'
              keep=is_complete_main_quest(q)
              issues=[]
              # Quality score is informational. Short quests can be complete with only
              # one or two detailed actions, so do not classify them as missing solely
              # from step count/score. True content failures are checked globally below.
              if not q.get('steps'): issues.append('NO_GUIDE_CONTENT')
              if not q.get('rewards'): issues.append('MISSING_REWARDS')
              status='OK' if not issues else '+'.join(issues)
              audit.append([q['name'],source,len(q['steps']),score,len(q['rewards']),status])
              rebuilt.append(q)
              if idx%20==0: print(f'Processed {idx}/{len(titles)} canonical quests...')
              time.sleep(0.04)

          # Every canonical quest must survive generation. Never silently filter one out.
          if len(rebuilt)!=len(titles):
              raise RuntimeError(f'Quest loss detected: canonical={len(titles)} output={len(rebuilt)}')
          # A short quest is not automatically an incomplete quest. Earlier builds used
          # len(steps)<3 / quality<45 as a fatal gate, which falsely rejected many
          # legitimate short OSRS quests (for example Doric's Quest and Imp Catcher).
          # Keep quality() for auditing, but only fail when the actual guide content is
          # absent/unusable or contains a real placeholder/sub-guide shortcut.
          def hard_incomplete(q):
              steps=q.get('steps',[]) or []
              texts=[clean(x.get('text','')) for x in steps]
              texts=[t for t in texts if t and not REWARD_LIKE_STEP.search(t)]
              joined=' '.join(texts)
              if not texts:
                  return True
              # Require real actionable walkthrough content, not a heading or tiny fragment.
              if len(joined) < 55 or not ACTION.search(joined):
                  return True
              return False

          weak=[q['name'] for q in rebuilt if hard_incomplete(q)]
          short_but_valid=[q['name'] for q in rebuilt if not hard_incomplete(q) and (len(q.get('steps',[]))<3 or quality(q.get('steps',[]))<45)]
          missing_rewards=[q['name'] for q in rebuilt if not q.get('rewards')]
          # Initial gate only blocks true placeholders/sub-guide shortcuts.
          # Terse but concrete actions are deliberately deferred to the global full-guide
          # repair pass below, which replaces them from the full OSRS Wiki walkthrough.
          # The final shipping gate still rejects any terse fragments that remain afterwards.
          unresolved=[]
          terse_pending=[]
          for q in rebuilt:
              for st in q.get('steps',[]):
                  txt=clean(st.get('text',''))
                  if BAD.search(txt) or SUBGUIDE.match(txt) or VAGUE.match(txt):
                      unresolved.append((q['name'],txt))
                  elif is_terse_fragment(txt):
                      terse_pending.append((q['name'],txt))
                      q['needsDetailRepair']=True
          if weak:
              raise RuntimeError('Walkthrough content genuinely missing/unusable: '+', '.join(weak[:20]))
          if missing_rewards:
              raise RuntimeError('Reward metadata missing for: '+', '.join(missing_rewards[:20]))
          if unresolved:
              raise RuntimeError('Placeholder/sub-guide text remains: '+repr(unresolved[:10]))
          if terse_pending:
              print('INFO: deferring terse concrete steps to global repair pass:', repr(terse_pending[:20]))
          if short_but_valid:
              print('INFO: short but complete quest guides accepted:', ', '.join(short_but_valid[:40]))

          review_rows=[r for r in audit if r[-1]!='OK']
          Path('questmate-complete/guide-review-needed.txt').write_text(
              '\n'.join(f'{r[0]} | source={r[1]} | steps={r[2]} | score={r[3]} | rewards={r[4]}' for r in review_rows) or 'All retained quest entries passed the strict quests-only completeness gate.',
              encoding='utf-8')

          rebuilt.sort(key=lambda x:x.get('name','').lower())
          OUT.write_text(json.dumps(rebuilt,ensure_ascii=False,separators=(',',':')),encoding='utf-8')
          with AUDIT.open('w',newline='',encoding='utf-8') as f:
              w=csv.writer(f); w.writerow(['quest','primary_source','step_count','quality_score','reward_count','status']); w.writerows(audit)
          REPORT.write_text(
              'QuestMate guide build report\n'
              f'Retained main quests: {len(rebuilt)}\n'
              f'OSRS Wiki primary guides: {counts["wiki"]}\n'
              f'RuneLite Quest Helper primary guides: {counts["runelite"]}\n'
              f'Embedded seed fallbacks: {counts["seed"]}\n'
              f'Guides flagged for manual review: {counts["weak"]}\n'
              f'Entries missing parsed rewards: {counts["missing_rewards"]}\n'
              'v50 audits every generated quest for placeholders and sub-guide shortcuts before repair, then runs a global full-guide repair pass for terse concrete steps; the final shipping gate rejects any placeholder, sub-guide shortcut, terse fragment, or incomplete guide that remains.\n'
              'Defence XP quests are marked blue; Prayer XP quests are marked yellow. See guide-audit.csv for filtered entries.\n'
              'No external wiki links are stored in quests.json.\n', encoding='utf-8')
          print(REPORT.read_text())
          PYEOF

          rm -rf /tmp/quest-helper
          git clone --depth 1 https://github.com/Zoinkwiz/quest-helper.git /tmp/quest-helper >/dev/null 2>&1 || echo 'RuneLite Quest Helper clone unavailable; continuing with OSRS Wiki + seed data.'

          if ! python3 /tmp/enrich_quests.py; then
            echo 'ERROR: guide enrichment/validation failed. Refusing to build an incomplete QuestMate APK.'
            echo 'The build intentionally stops here rather than shipping missing quests, placeholder walkthroughs, sub-guides, or incomplete rewards.'
            exit 1
          fi
          rm questmate-complete/app/src/main/assets/quests_seed.json

          # Build a second, independent post-Tutorial-Island -> Quest Cape route.
          # The route uses the live OSRS Wiki Optimal quest guide ordering and retains
          # training/activity rows, while the app links quest rows back to the existing
          # detailed QuestMate quest walkthroughs.
          cat > /tmp/build_cape_route.py <<'PYEOF'
          import json,re,requests
          from bs4 import BeautifulSoup
          from pathlib import Path

          DB=Path('questmate-complete/app/src/main/assets/quests.json')
          OUT=Path('questmate-complete/app/src/main/assets/cape_route.json')
          quests=json.loads(DB.read_text(encoding='utf-8'))
          names=[q.get('name','').strip() for q in quests if q.get('name','').strip()]
          by_norm={re.sub(r'[^a-z0-9]','',n.lower()):n for n in names}

          def clean(x):
              return re.sub(r'\s+',' ',x or '').strip()
          def norm(x):
              return re.sub(r'[^a-z0-9]','',clean(x).lower())

          route=[{
              'type':'milestone','title':'Start — Mainland arrival after Tutorial Island',
              'detail':'Begin in Lumbridge immediately after finishing Tutorial Island. This route is for a normal members account and prioritises quest XP, major unlocks, transport, area batching and minimum necessary skilling on the path to the Quest Point Cape.'
          }]

          url='https://oldschool.runescape.wiki/api.php'
          params={'action':'parse','page':'Optimal_quest_guide','prop':'text','format':'json','formatversion':'2'}
          sess=requests.Session()
          sess.headers.update({'User-Agent':'QuestMateRouteBuilder/34.0 (educational Android guide builder)'})
          r=sess.get(url,params=params,timeout=30)
          r.raise_for_status()
          html=r.json().get('parse',{}).get('text','')
          if not html:
              raise RuntimeError('OSRS Wiki Optimal quest guide returned no parse text')
          soup=BeautifulSoup(html,'lxml')

          found=[]
          matched=set()
          skills=('attack','strength','defence','defense','ranged','prayer','magic','runecraft','construction','hitpoints','agility','herblore','thieving','crafting','fletching','slayer','hunter','mining','smithing','fishing','cooking','firemaking','woodcutting','farming','sailing')
          for table in soup.find_all('table'):
              rows=table.find_all('tr')
              if not rows: continue
              headers=[]
              for tr in rows[:4]:
                  hs=tr.find_all('th',recursive=False)
                  if len(hs)>=2:
                      headers=[clean(h.get_text(' ',strip=True)) for h in hs]
                      break
              hlow=[x.lower() for x in headers]
              if not headers or not any(('quest' in x and 'activity' in x) or x=='quest' for x in hlow):
                  continue
              for tr in rows:
                  cells=tr.find_all(['td','th'],recursive=False)
                  if not cells or all(c.name=='th' for c in cells): continue
                  first=clean(cells[0].get_text(' ',strip=True))
                  if not first: continue
                  low=first.lower()
                  if 'tutorial island' in low or 'learning the ropes' in low: continue
                  # Match canonical quest names by visible text and link title.
                  candidates=[first]
                  for a in cells[0].find_all('a'):
                      candidates.extend([clean(a.get_text(' ',strip=True)),clean(a.get('title',''))])
                  quest_name=''
                  for c in candidates:
                      nc=norm(c)
                      if nc in by_norm:
                          quest_name=by_norm[nc]; break
                  details=[]
                  for idx,c in enumerate(cells[1:],1):
                      txt=clean(c.get_text(' ',strip=True))
                      if not txt: continue
                      label=headers[idx] if idx<len(headers) else ''
                      if label:
                          details.append(f'{label}: {txt}')
                      else:
                          details.append(txt)
                  detail=' • '.join(details)
                  if quest_name:
                      found.append({'type':'quest','title':'Complete '+quest_name,'questName':quest_name,'detail':detail})
                      matched.add(quest_name)
                  else:
                      # Preserve useful training/preparation/activity rows from the optimal guide.
                      useful=('train' in low or 'level' in low or 'experience' in low or 'xp' in low or
                              any(sk in low for sk in skills) or low.startswith(('obtain ','buy ','collect ','complete ','unlock ','start ')))
                      if useful and len(first)<180:
                          found.append({'type':'training','title':first,'detail':detail})

          # De-duplicate identical adjacent route rows without removing deliberately repeated training.
          dedup=[]
          for x in found:
              key=(x.get('type'),x.get('title'),x.get('questName',''))
              if dedup and key==(dedup[-1].get('type'),dedup[-1].get('title'),dedup[-1].get('questName','')):
                  continue
              dedup.append(x)
          route.extend(dedup)

          # Safety coverage: if the live optimal guide omits/renames a canonical quest,
          # never silently omit it from the cape route. Append only unmatched canonical quests.
          missing=[n for n in names if n not in matched]
          if missing:
              route.append({'type':'milestone','title':'Final quest coverage check',
                            'detail':'These quests were not matched by name in the live Optimal quest guide table. Complete them before claiming the cape; tap each one for the full QuestMate walkthrough.'})
              for n in missing:
                  route.append({'type':'quest','title':'Complete '+n,'questName':n,'detail':'Canonical QuestMate quest entry — required for complete quest coverage.'})

          route.append({'type':'milestone','title':'Quest Cape — claim your reward',
                        'detail':'After all quests are complete, go to the Wise Old Man in Draynor Village and purchase the Quest point cape and hood for 99,000 coins.'})

          quest_steps=[x for x in route if x.get('type')=='quest']
          covered={x.get('questName') for x in quest_steps}
          assert len(covered)==len(set(names)), f'Cape route coverage mismatch: {len(covered)}/{len(set(names))}'
          assert len(route)>len(names), 'Cape route did not retain training/activity steps'
          OUT.write_text(json.dumps(route,ensure_ascii=False,separators=(',',':')),encoding='utf-8')
          Path('questmate-complete/cape-route-report.txt').write_text(
              f'Route rows: {len(route)}\nQuest rows: {len(quest_steps)}\nCanonical quests covered: {len(covered)}\nTraining/activity rows: {sum(1 for x in route if x.get("type")=="training")}\nUnmatched canonical quests appended: {len(missing)}\n',
              encoding='utf-8')
          print(Path('questmate-complete/cape-route-report.txt').read_text())
          PYEOF
          python3 /tmp/build_cape_route.py

