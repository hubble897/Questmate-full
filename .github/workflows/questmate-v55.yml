          assert not any(x in all_step_text for x in forbidden_exact), 'Desert Treasure II sub-guide shortcuts survived expansion'
          demon=[q for q in d if re.sub(r'[^a-z0-9]','',q.get('name','').lower())=='demonslayer']
          assert demon and any('Carlem' in x.get('text','') and 'Gabindo' in x.get('text','') and 'order is random' in x.get('text','').lower() for x in demon[0]['steps']), 'Demon Slayer incantation guidance missing'
          dt2=[q for q in d if re.sub(r'[^a-z0-9]','',q.get('name','').lower()) in ('deserttreasureiithefallenempire','deserttreasure2thefallenempire','deserttreasureii')]
          assert dt2 and len(dt2[0].get('steps',[]))>=45, 'Desert Treasure II fully-expanded guide is still too short'
          print(f'Validated {len(d)} quests-only entries. Guides with fewer than 3 extracted steps: {len(weak)}')
          print('Short-guide examples:', weak[:15])
          PY
          cat questmate-complete/guide-build-report.txt

      - name: Cross-check requirements against RuneLite Quest Helper
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/quest-helper
          git clone --depth 1 https://github.com/Zoinkwiz/quest-helper.git /tmp/quest-helper
          python3 - <<'PY'
          import json,re
          from pathlib import Path
          db=Path('questmate-complete/app/src/main/assets/quests.json')
          qs=json.load(open(db,encoding='utf-8'))
          root=Path('/tmp/quest-helper/src/main/java')
          java=list(root.rglob('*.java'))
          def key(x): return re.sub(r'[^a-z0-9]','',x.lower())
          report=[]; matched=0
          # Quest Helper is used as an independent cross-check: its helper files expose
          # SkillRequirement and QuestRequirement objects. Wiki remains the display source.
          for q in qs:
              words=[w for w in re.findall(r'[A-Za-z0-9]+',q['name']) if len(w)>2]
              candidates=[]
              for p in java:
                  stem=key(p.stem)
                  score=sum(key(w) in stem for w in words)
                  if score>=max(1,min(2,len(words))): candidates.append((score,p))
              candidates.sort(key=lambda x:x[0],reverse=True)
              if not candidates: continue
              text=candidates[0][1].read_text(errors='ignore')
              skill_hits=re.findall(r'new\s+SkillRequirement\s*\([^,]+,\s*(\d+)',text)
              quest_hits=re.findall(r'new\s+QuestRequirement\s*\([^,]+,\s*QuestDetails\.([A-Z0-9_]+)',text)
              if skill_hits or quest_hits:
                  matched+=1
                  report.append(f"{q['name']} | helper={candidates[0][1].name} | skill objects={len(skill_hits)} | quest objects={len(quest_hits)}")
          Path('questmate-complete/runelite-requirements-crosscheck.txt').write_text(
              'RuneLite Quest Helper requirement cross-check\nMatched helper requirement files: '+str(matched)+'\n'+'\n'.join(report),encoding='utf-8')
          print('RuneLite requirement cross-check matched:',matched)
          assert matched>50, 'RuneLite cross-check unexpectedly matched too few quest helpers'
          PY

      - name: Full per-quest accuracy and completeness audit
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,re
          from pathlib import Path

          P=Path('questmate-complete/app/src/main/assets/quests.json')
          R=Path('questmate-complete/app/src/main/assets/cape_route.json')
          qs=json.load(open(P,encoding='utf-8'))
          route=json.load(open(R,encoding='utf-8'))

          BAD=re.compile(r'\b(?:todo|tbd|placeholder|unknown|relevant npc|relevant location|do step|find npc|find location|continue quest|follow wiki|see wiki|use wiki)\b',re.I)
          vague=re.compile(r'^(?:go there|talk to them|continue|finish the quest|complete the quest|do the puzzle|do the fight)\.?$',re.I)
          names={q['name'] for q in qs}
          errors=[]; warnings=[]; rows=[]

          for q in qs:
              e=[]; w=[]
              name=q.get('name','').strip()
              items=q.get('items') or []
              req=q.get('requirements') or []
              skills=q.get('skillRequirements') or {}
              prereq=q.get('questRequirements') or []
              start=q.get('start','').strip()
              steps=q.get('steps') or []
              rewards=q.get('rewards') or []

              if not name: e.append('missing quest name')
              if not start: e.append('missing starting location/NPC')
              if len(steps)<2: e.append(f'walkthrough has only {len(steps)} step(s)')
              if not rewards: e.append('missing rewards')
              if q.get('membership') not in ('F2P','P2P'): e.append('invalid F2P/P2P classification')

              combined=' '.join([name,start,*items,*req,*prereq,*rewards]+[
                  (x.get('title','')+' '+x.get('text','')) if isinstance(x,dict) else str(x) for x in steps
              ])
              if BAD.search(combined): e.append('placeholder/vague filler detected')

              for i,st in enumerate(steps,1):
                  text=(st.get('text','') if isinstance(st,dict) else str(st)).strip()
                  if len(text)<12: w.append(f'step {i} unusually short')
                  if vague.fullmatch(text): e.append(f'step {i} is vague: {text}')

              for pq in prereq:
                  if pq not in names: e.append(f'prerequisite not in quest database: {pq}')

              # Item quantities: warn on suspicious bare generic items, but do not invent a number
              # when the authoritative source genuinely treats quantity as flexible/optional.
              for it in items:
                  t=str(it).strip()
                  if not t: e.append('blank item requirement')
                  if re.search(r'\b(?:coins?|logs?|bones?|food|runes?)\b',t,re.I) and not re.search(r'\d|any|some|optional|recommended|enough',t,re.I):
                      w.append('quantity may need manual/source review: '+t)

              # Reward-colour metadata must agree with reward text.
              reward_text=' '.join(rewards).lower()
              defxp=bool(re.search(r'\bdefen[cs]e\b.{0,45}\b(?:xp|experience)\b|\b(?:xp|experience)\b.{0,45}\bdefen[cs]e\b',reward_text,re.I))
              prayxp=bool(re.search(r'\bprayer\b.{0,45}\b(?:xp|experience)\b|\b(?:xp|experience)\b.{0,45}\bprayer\b',reward_text,re.I))
              if bool(q.get('defenceReward'))!=defxp: w.append('Defence colour metadata differs from reward text scan')
              if bool(q.get('prayerReward'))!=prayxp: w.append('Prayer colour metadata differs from reward text scan')

              rows.append({'quest':name,'errors':e,'warnings':w,'steps':len(steps),'items':len(items),
                           'skills':skills,'prerequisites':prereq,'start':start})
              errors.extend(f'{name}: {x}' for x in e)
              warnings.extend(f'{name}: {x}' for x in w)

          # Quest Cape route coverage and order checks.
          route_quests=[x.get('questName') for x in route if x.get('type')=='quest']
          missing_route=[n for n in names if n not in route_quests]
          duplicate_route=sorted({n for n in route_quests if route_quests.count(n)>1})
          if missing_route: warnings.append('Quest Cape route missing quests: '+', '.join(sorted(missing_route)))
          if duplicate_route: warnings.append('Quest Cape route duplicate quest entries: '+', '.join(duplicate_route))

          report=Path('questmate-complete/full-quest-audit.txt')
          lines=[
              'QUESTMATE v55 FULL QUEST-BY-QUEST AUDIT',
              f'Quest records: {len(qs)}',
              f'Hard completeness errors: {len(errors)}',
              f'Review warnings: {len(warnings)}',
              f'Quest Cape route quest rows: {len(route_quests)}',
              ''
          ]
          for row in rows:
              lines.append('=== '+row['quest']+' ===')
              lines.append(f"Steps: {row['steps']} | Items: {row['items']} | Skills: {row['skills']} | Prerequisites: {row['prerequisites']}")
              lines.append('Start: '+row['start'])
              for x in row['errors']: lines.append('ERROR: '+x)
              for x in row['warnings']: lines.append('WARNING: '+x)
          if missing_route: lines.append('\nROUTE MISSING: '+', '.join(sorted(missing_route)))
          if duplicate_route: lines.append('ROUTE DUPLICATES: '+', '.join(duplicate_route))
          report.write_text('\n'.join(lines),encoding='utf-8')

          print('\n'.join(lines[:8]))
          if errors:
              print('First hard errors:')
              print('\n'.join(errors[:80]))
              raise SystemExit('Full quest audit found hard completeness errors; refusing to build an inaccurate APK.')
          print('FULL QUEST AUDIT: PASS (warnings remain available in audit artifact)')
          PY

      - name: Validate v55 quest layout data
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          q=json.load(open('questmate-complete/app/src/main/assets/quests.json',encoding='utf-8'))
          assert len(q)>=150
          assert all(x.get('items') is not None for x in q)
          assert all('requirements' in x and 'skillRequirements' in x and 'questRequirements' in x for x in q)
          assert all(x.get('membership') in ('F2P','P2P') for x in q)
          assert all(x.get('start','').strip() for x in q)
          assert all(x.get('steps') for x in q)
          assert all(x.get('rewards') for x in q)
          print('v55 quest records:',len(q),'F2P:',sum(x['membership']=='F2P' for x in q),'P2P:',sum(x['membership']=='P2P' for x in q))
          PY

