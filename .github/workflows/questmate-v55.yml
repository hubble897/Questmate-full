          bad_words=('relevant npc','relevant location','unknown quest','placeholder','go to the relevant','talk to the relevant')
          joined=json.dumps(d).lower()
          assert not any(x in joined for x in bad_words), 'Vague/filler quest text detected'
          weak=[q['name'] for q in d if len(q.get('steps',[]))<3]
          placeholder_re=re.compile(r"(?i)not yet implemented|unknown|relevant npc|relevant location|placeholder|broken step state|\bdo step\b|\bcomplete this step\b|\bfollow the step\b|^\s*(?:do|complete|follow|perform|finish|continue(?: with)?|work through)\s+(?:the\s+)?[^.]{2,100}?\s+(?:steps?|section|part|route|sub-?guide)\s*[.!]?\s*$|^\s*(?:solve|complete|finish|do|perform|follow|continue|defeat)\s+(?:the\s+)?(?:[a-z0-9' -]+\s+)?(?:puzzle|section|part|route|fight|boss|trial|challenge|steps?|sub-?guide)\s*[.!]?\s*$")
          bad_steps=[(q['name'],s.get('text','')) for q in d for s in q.get('steps',[]) if placeholder_re.search(s.get('text',''))]
